  /* ============================ Màn: nhật ký ============================ */

  function audit() {
    var u = me();
    var canExport = ['QUAN_LY_LS', 'ADMIN'].indexOf(u.role) !== -1;
    var period = f('audit', 'period', 'week');
    var range = U.periodRange(period, f('audit', 'from', ''), f('audit', 'to', ''), st().settings.week_start);

    var list = visibleEvents().filter(function (e) {
      var t = new Date(e.at).getTime();
      return t >= range.from && t <= range.to;
    });

    if (u.role === 'ADMIN') {
      st().configLog.forEach(function (c) {
        var t = new Date(c.at).getTime();
        if (t >= range.from && t <= range.to) {
          list.push({ event_id: c.id, item_id: '', type: 'CAU_HINH', by: c.by, at: c.at, reason: c.area + ': ' + c.detail });
        }
      });
      list.sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
    }

    var q = String(f('audit', 'q', '')).trim().toLowerCase();
    if (q) {
      list = list.filter(function (e) {
        return (e.item_id + ' ' + D.label(e.type) + ' ' + userName(e.by) + ' ' + e.reason).toLowerCase().indexOf(q) !== -1;
      });
    }

    var periodOpts = [['week', 'Tuần này'], ['month', 'Tháng này'], ['quarter', 'Quý này'], ['year', 'Năm nay'], ['custom', 'Khoảng ngày']];

    return ui.block({
      title: 'Nhật ký sự kiện', count: list.length, icon: 'history',
      actions: canExport ? ui.btn('Xuất CSV', { act: 'export-csv', icon: 'download', sm: true }) : '',
      note: U.fmtDate(new Date(range.from).toISOString()) + ' – ' + U.fmtDate(new Date(range.to).toISOString()) +
        ' · múi giờ ' + U.esc(st().settings.timezone) +
        (canExport ? '' : ' · chỉ quản lý và quản trị được xuất báo cáo'),
      filters: listSearch('audit', 'Mã việc, người thực hiện, lý do') +
        ui.select('', periodOpts, period, { attrs: ' data-filter-screen="audit" data-filter="period" style="flex:0 1 150px"' }) +
        (period === 'custom'
          ? ui.input('', f('audit', 'from', U.localDate()), { type: 'date', attrs: ' data-filter-screen="audit" data-filter="from" style="flex:0 1 150px"', id: 'ffrom' }) +
          ui.input('', f('audit', 'to', U.localDate()), { type: 'date', attrs: ' data-filter-screen="audit" data-filter="to" style="flex:0 1 150px"', id: 'fto' })
          : ''),
      body: ui.table(
        [{ label: 'Thời gian', cls: 'fit' }, { label: 'Mã việc', cls: 'fit' }, { label: 'Sự kiện', cls: 'fit' }, { label: 'Người thực hiện' }, { label: 'Nội dung' }],
        list.map(function (e) {
          return {
            cells: [
              '<span class="tid">' + U.fmtDT(e.at) + '</span>',
              e.item_id
                ? '<button class="btn btn-quiet btn-sm tid" data-act="detail" data-id="' + U.attr(e.item_id) + '">' + U.esc(e.item_id) + '</button>'
                : '<span class="t2">—</span>',
              ui.tag(D.label(e.type), D.tone(e.type)),
              '<div class="t2">' + U.esc(userName(e.by) || e.by) + '</div>',
              '<div class="t2">' + U.esc(e.reason) + '</div>'
            ]
          };
        }),
        { icon: 'history', title: 'Không có sự kiện trong kỳ đã chọn', text: '', tableClass: 'audit-table' }
      )
    });
  }

  /* ============================ Hộp thoại: chi tiết ============================ */

  function detail(itemId) {
    var i = U.byId(st().items, 'item_id', itemId);
    if (!i) { ui.toast('Không tìm thấy việc.', 'err'); return; }

    var r = reqOf(i), wt = wtOf(i), u = me();
    var masked = u.role === 'ADMIN';
    var evts = st().events.filter(function (e) { return e.item_id === itemId; });
    var sends = st().outbox.filter(function (o) { return o.item_id === itemId; });
    var acts = actionsFor(i);
    var body = '';

    // Không đưa SLA/hạn xử lý lên màn hồ sơ khách; cán bộ xem bộ đếm giờ làm
    // thực tế ở phần Công việc bên dưới.
    if (i.pending) body += ui.banner('warn', 'Có đề nghị sửa chờ kiểm soát duyệt', i.pending.reason);

    body += ui.sectionTitle('Khách hàng') +
      (masked
        ? '<p class="t2">Vai trò quản trị hệ thống không được xem thông tin khách hàng.</p>'
        : ui.kv([
          ['Tên', r ? r.customer.name : '—'],
          ['CIF', r && r.customer.cif ? r.customer.cif : 'Khách mới'],
          ['Điện thoại', r ? r.customer.phone : ''],
          ['Email', r ? r.customer.email : ''],
          ['Đơn vị gửi', r ? unitName(r.unit_id) : ''],
          ['Người gửi', r ? userName(r.created_by) : '']
        ]) + (r && r.note ? '<p class="t2" style="margin-top:.625rem">Ghi chú: ' + U.esc(r.note) + '</p>' : ''));

    body += '<div style="margin-top:1.125rem">' + ui.sectionTitle('Công việc') +
      ui.kv([
        ['Loại việc', wt ? (wt.group || wt.name) : i.work_type_code],
        ['Sản phẩm', productLabel(i)],
        ['Ngày phát sinh', U.fmtDate(i.occurrence_date)],
        // Mốc hồ sơ vào LS — tính từ lúc phòng gửi (submitted_at), không phải lúc
        // cán bộ bấm "Bắt đầu xử lý". Tách riêng khỏi đồng hồ làm việc bên dưới.
        ['Hồ sơ vào LS lúc', i.submitted_at ? U.fmtDT(i.submitted_at) : '—'],
        ['Trạng thái', ui.statusTag(i.status), true],
        ['Cán bộ xử lý', userName(i.assigned_user_id) || 'Chưa giao'],
        ['Giờ làm thực tế của cán bộ', D.processingLabel(i, st())],
        ['Hoàn thành', i.completed_at ? U.fmtDT(i.completed_at) : '—'],
        ['Phiên bản', 'v' + i.version]
      ]) + '</div>';

    body += '<div data-checklist-box="' + U.attr(i.item_id) + '">' + checklistSection(i) + '</div>';
    body += linkedSection(i);

    if (i.appointment) {
      var ap = i.appointment;
      var chanLabel = (D.REACH_CHANNELS.filter(function (c) { return c.code === ap.channel; })[0] || {}).label ||
        (ap.channel === 'NHOM' ? 'Nhóm Zalo nội bộ' : ap.channel);
      body += '<div style="margin-top:1.125rem">' + ui.sectionTitle('Lịch hẹn ký') +
        ui.kv([
          ['Ngày ký', U.fmtDate(ap.date || ap.at)],
          ['Giờ ký', ap.time || U.fmtTime(ap.at)],
          ['Nơi ký', ap.place],
          ['Kênh báo khách', chanLabel]
        ]) +
        (ap.via_group
          ? ui.banner('warn', 'Khách không có kênh liên hệ trực tiếp',
            'Hệ thống nhắn nhóm Zalo nội bộ và gắn thẻ ' +
            (D.officerTag(i, st()) || 'cán bộ phụ trách') + ' để liên hệ mời khách lên ký.')
          : '') +
        '</div>';
    }

    // Tin gửi khách phải do người phụ trách xem trước và xác nhận, nên nút
    // xác nhận nằm ngay trong chi tiết việc chứ không chỉ ở màn quản trị.
    var mayConfirm = i.assigned_user_id === u.user_id || ['KS_LS', 'QUAN_LY_LS'].indexOf(u.role) !== -1;
    var waiting = sends.filter(function (o) { return o.status === 'CHO_XAC_NHAN'; });

    if (waiting.length && mayConfirm) {
      body += ui.banner('warn', waiting.length + ' tin đang chờ bạn xác nhận trước khi gửi',
        'Xem trước nội dung rồi mới bấm gửi. Gửi rồi không thu hồi được.');
    }

    body += '<div style="margin-top:1.125rem">' + ui.sectionTitle('Tin gửi đi') +
      (sends.length
        ? ui.table(
          [{ label: 'Kênh', cls: 'fit' }, { label: 'Người nhận' }, { label: 'Trạng thái', cls: 'fit' },
          { label: 'Ghi chú' }, { label: '', cls: 'fit' }],
          sends.map(function (o) {
            return {
              cls: o.status === 'CHO_XAC_NHAN' ? 'flag-warn' : (o.status === 'THAT_BAI' ? 'flag' : ''),
              cells: [
                '<div class="t2">' + U.esc(D.CHANNELS[o.channel] ? D.CHANNELS[o.channel].name : o.channel) + '</div>',
                '<div class="t2">' + U.esc(o.recipient_name) + '<br>' + U.esc(U.mask(o.recipient)) + '</div>',
                ui.tag(D.OUT_STATUS[o.status].label, D.OUT_STATUS[o.status].tone),
                '<div class="t2">' + U.esc(o.note || o.provider_id || '—') + '</div>',
                o.status === 'CHO_XAC_NHAN' && mayConfirm
                  ? ui.btn('Xem & gửi', { kind: 'primary', sm: true, act: 'out-confirm', data: ' data-id="' + U.attr(o.outbox_id) + '"' })
                  : ''
              ]
            };
          })
        )
        : '<p class="t2">Chưa phát sinh tin nào cho việc này.</p>') + '</div>';

    body += '<div style="margin-top:1.125rem">' + ui.sectionTitle('Lịch sử') +
      ui.timeline(evts.map(function (e) {
        return { title: D.label(e.type), time: U.fmtDT(e.at) + ' · ' + (userName(e.by) || e.by), text: e.reason };
      })) + '</div>';

    body += '<div class="form-end" data-hotkeys>' +
      (canEdit(i) ? ui.btn('Sửa thông tin', { act: 'edit-item', data: ' data-id="' + U.attr(i.item_id) + '" aria-keyshortcuts="E"', icon: 'pencil', title: 'Phím E' }) : '') +
      acts.map(function (a, n) {
        return n < 9 ? ui.btn(a.label, {
          kind: a.primary ? 'primary' : 'line', act: 'flow', title: 'Phím ' + (n + 1),
          data: ' data-id="' + U.attr(i.item_id) + '" data-to="' + a.to + '" data-hotkey="' + (n + 1) + '" aria-keyshortcuts="' + (n + 1) + '"'
        }) : ui.btn(a.label, { kind: 'line', act: 'flow', data: ' data-id="' + U.attr(i.item_id) + '" data-to="' + a.to + '"' });
      }).join('') + '</div>';

    ui.openDialog('Việc ' + itemRef(i), '<div data-detail="' + U.attr(i.item_id) + '">' + body + '</div>',
      { size: 'md', sub: (wt ? (wt.group || wt.name) : '') + ' · ' + i.product_name });
  }

  /** Hộp thoại chi tiết của việc này còn đang mở trên màn hình. */
  function detailShowing(itemId) {
    return ui.dialogOpen() && !!document.querySelector('#dialog [data-detail="' + String(itemId).replace(/["\\]/g, '') + '"]');
  }

  function checklistSection(i) {
    var wt = wtOf(i), u = me();
    if (!wt || !wt.checklist.length) return '';
    var values = Array.isArray(i.checklist) ? i.checklist : [];
    var done = wt.checklist.filter(function (_, idx) { return values[idx] === true; }).length;
    var canTick = i.assigned_user_id === u.user_id || ['KS_LS', 'QUAN_LY_LS'].indexOf(u.role) !== -1;
    return '<div style="margin-top:1.125rem">' + ui.sectionTitle('Việc cần làm') +
      '<p class="t2">Đã hoàn thành ' + done + '/' + wt.checklist.length + ' nhóm.</p>' +
      '<div class="f-stack">' + wt.checklist.map(function (c, idx) {
        return '<label class="chan-check"><input type="checkbox" data-act="checklist-toggle" data-id="' + U.attr(i.item_id) + '" data-index="' + idx + '"' + (values[idx] === true ? ' checked' : '') + (canTick ? '' : ' disabled') + '><span>' + U.esc(c) + '</span></label>';
      }).join('') + '</div>' +
      (done === wt.checklist.length ? ui.banner('ok', 'Đã ghi nhận đủ các nhóm việc', '') : '') + '</div>';
  }

  function refreshChecklistBox(itemId) {
    if (!detailShowing(itemId)) return;
    var box = document.querySelector('#dialog [data-checklist-box="' + String(itemId).replace(/["\\]/g, '') + '"]');
    var i = U.byId(st().items, 'item_id', itemId);
    if (box && i) box.innerHTML = checklistSection(i);
  }

  /*
   * Tích nhiều ô liên tiếp: trước đây ô thứ hai bị bỏ qua trong lúc ô đầu còn
   * đang lưu, nhưng trên màn hình vẫn hiện đã tích — người dùng tưởng đã lưu.
   * Giờ mỗi lần tích chỉ đổi dữ liệu tại chỗ; sau một nhịp ngắn gửi nguyên mảng
   * hiện tại lên máy chủ, các lần gửi nối đuôi nhau nên phiên bản luôn khớp.
   */
  var checklistQueue = {};

  function checklistPending(itemId) {
    var q = checklistQueue[itemId];
    return !!(q && (q.timer || q.busy));
  }

  function flushChecklist(itemId) {
    var q = checklistQueue[itemId];
    if (!q) return Promise.resolve();
    if (q.timer) {
      clearTimeout(q.timer);
      q.timer = null;
      q.chain = q.chain.then(function () { return sendChecklist(itemId); });
    }
    return q.chain;
  }

  function sendChecklist(itemId) {
    var q = checklistQueue[itemId], i = U.byId(st().items, 'item_id', itemId);
    if (!q || !i) return null;
    var values = (i.checklist || []).slice(), json = JSON.stringify(values);
    if (json === q.saved) return null;
    q.busy += 1;
    return LS.app.background(LS.api.saveChecklist(itemId, values, i.version), {
      label: 'Ghi nhận nhóm việc',
      onOk: function (result) {
        q.busy -= 1;
        q.saved = json;
        var live = U.byId(st().items, 'item_id', itemId);
        if (live && result && result.version) live.version = result.version;
      },
      rollback: function () {
        q.busy -= 1;
        var live = U.byId(st().items, 'item_id', itemId);
        if (live) live.checklist = JSON.parse(q.saved);
        refreshChecklistBox(itemId);
      }
    });
  }

  function saveChecklistToggle(itemId, index, checked) {
    var i = U.byId(st().items, 'item_id', itemId), wt = i && wtOf(i);
    if (!i || !wt || !wt.checklist.length || i.syncing) return;
    var values = Array.isArray(i.checklist) ? i.checklist.slice() : [];
    var saved = JSON.stringify(values);
    values[index] = !!checked;
    while (values.length < wt.checklist.length) values.push(false);
    i.checklist = values.slice(0, wt.checklist.length);
    refreshChecklistBox(itemId);

    if (U.isGas()) {
      var q = checklistQueue[itemId] || (checklistQueue[itemId] = { chain: Promise.resolve(), busy: 0, timer: null, saved: saved });
      if (q.timer) clearTimeout(q.timer);
      q.timer = setTimeout(function () { flushChecklist(itemId); }, 500);
      return;
    }
    i.version = Number(i.version || 1) + 1;
    logEvent(i.item_id, 'CAP_NHAT_CHECKLIST', i.checklist.filter(Boolean).length + '/' + wt.checklist.length + ' nhóm việc đã hoàn thành.');
    U.save();
  }

  /* ============================ Việc kèm (vd. hồ sơ TSĐB mới) ============================ */

  var LINKABLE_STATUS = ['DA_PHAN_CONG', 'DANG_THUC_HIEN', 'DA_SOAN_XONG', 'DANG_HEN_KH', 'TAM_DUNG'];
  var LINKED_GROUP = 'TSĐB';

  function linkedChildren(i) {
    return st().items.filter(function (x) { return x.parent_item_id && x.parent_item_id === i.item_id && x.status !== 'HUY'; });
  }

  function linkedOptions(i) {
    var taken = linkedChildren(i).map(function (x) { return x.work_type_code; });
    return st().workTypes.filter(function (w) {
      return w.active && w.group === LINKED_GROUP && w.code !== i.work_type_code && taken.indexOf(w.code) === -1;
    });
  }

  function canAddLinked(i) {
    var u = me();
    if (!u || i.syncing || i.parent_item_id || !i.assigned_user_id || LINKABLE_STATUS.indexOf(i.status) === -1) return false;
    if (u.role === 'CAN_BO_LS') return i.assigned_user_id === u.user_id;
    return ['KS_LS', 'QUAN_LY_LS'].indexOf(u.role) !== -1;
  }

  /**
   * Đang làm vay món mà có thêm tài sản mới: tích một ô là thành việc thứ hai
   * (dòng việc riêng, giao luôn cho người đang làm), nên báo cáo đếm 2 việc.
   */
  function linkedSection(i) {
    var parent = i.parent_item_id ? U.byId(st().items, 'item_id', i.parent_item_id) : null;
    var kids = linkedChildren(i);
    var html = '';
    if (parent) {
      html += '<div class="t2">Việc kèm của ' + U.esc(itemRef(parent)) + '</div>';
      html += '<div class="form-end" style="margin-top:.5rem">' +
        ui.btn('Mở việc chính', { sm: true, act: 'detail', data: ' data-id="' + U.attr(parent.item_id) + '"' }) + '</div>';
    }
    if (kids.length) {
      html += '<div class="f-stack" style="margin-top:.5rem">' + kids.map(function (k) {
        return '<div class="act-row"><span class="tid">' + U.esc(k.syncing ? 'Đang tạo…' : itemRef(k)) + '</span>' +
          '<span class="t2">' + U.esc(productLabel(k)) + '</span>' + ui.statusTag(k.status) +
          (k.syncing ? '' : ui.btn('Mở', { sm: true, kind: 'line', act: 'detail', data: ' data-id="' + U.attr(k.item_id) + '"' })) + '</div>';
      }).join('') + '</div>';
    }
    var opts = canAddLinked(i) ? linkedOptions(i) : [];
    if (opts.length) {
      var def = opts.filter(function (w) { return /nhập mới/i.test(w.name); })[0] || opts[0];
      html += '<label class="chan-check" style="margin-top:.625rem"><input type="checkbox" data-act="linked-toggle">' +
        '<span>Có làm kèm hồ sơ TSĐB (tài sản mới) — tính thêm 1 việc</span></label>' +
        '<div data-linked-box hidden style="margin-top:.5rem">' +
        '<div class="f-row">' + ui.field('Sản phẩm TSĐB', ui.select('linked_type', opts.map(function (w) { return [w.code, w.name]; }), def.code, { attrs: ' data-role="linked-type"' })) + '</div>' +
        '<div class="form-end">' + ui.btn('Thêm việc TSĐB', { kind: 'primary', sm: true, act: 'add-linked', data: ' data-id="' + U.attr(i.item_id) + '"' }) + '</div></div>';
    }
    if (!html) return '';
    return '<div style="margin-top:1.125rem">' + ui.sectionTitle('Việc kèm') + html + '</div>';
  }

  function toggleLinkedBox(on) {
    var box = document.querySelector('#dialog [data-linked-box]');
    if (box) box.hidden = !on;
  }

  function addLinked(parentId) {
    var parent = U.byId(st().items, 'item_id', parentId);
    var sel = document.querySelector('#dialog [data-role="linked-type"]');
    var wt = sel ? U.byId(st().workTypes, 'code', sel.value) : null;
    if (!parent || !canAddLinked(parent)) { ui.toast('Không thể thêm việc kèm ở trạng thái này.', 'err'); return; }
    if (!wt || linkedOptions(parent).indexOf(wt) === -1) { ui.toast('Chọn sản phẩm TSĐB hợp lệ.', 'err'); return; }
    var ts = U.now();
    var child = {
      item_id: U.isGas() ? 'TAM_' + Date.now().toString(36).toUpperCase() : U.uid('ITEM'),
      period_id: parent.period_id || '', parent_item_id: parent.item_id, request_id: parent.request_id,
      work_type_code: wt.code, product_name: wt.name, occurrence_date: U.localDate(),
      source_tab: parent.source_tab || '', status: 'DANG_THUC_HIEN',
      assigned_user_id: parent.assigned_user_id, assigned_by: st().session,
      submitted_at: ts, accepted_at: ts, assigned_at: ts, due_at: D.dueFrom(ts, wt.code, st()),
      completed_at: '', processing_started_at: ts, appointment: null,
      checklist: wt.checklist.map(function () { return false; }), note: '', pending: null, version: 1
    };
    st().items.unshift(child);

    if (U.isGas()) {
      var tmp = child.item_id;
      child.syncing = true;
      detail(parentId);
      LS.app.render();
      LS.app.background(LS.api.addLinkedItem(parentId, wt.code), {
        label: 'Thêm việc kèm',
        onOk: function (result) {
          var row = U.byId(st().items, 'item_id', tmp);
          if (row) { row.item_id = result.item_id; row.syncing = false; }
          if (detailShowing(parentId)) detail(parentId); else if (!ui.dialogOpen()) LS.app.render();
          ui.toast('Đã thêm việc ' + wt.name + ' — tính thành việc riêng.', 'ok');
        },
        rollback: function () {
          st().items = st().items.filter(function (x) { return x.item_id !== tmp; });
          if (detailShowing(parentId)) detail(parentId);
        }
      });
      return;
    }
    logEvent(child.item_id, 'TAO_VIEC', 'Việc kèm của ' + itemRef(parent) + ' — bắt đầu xử lý ngay.');
    U.save();
    detail(parentId);
    LS.app.render();
    ui.toast('Đã thêm việc ' + wt.name + ' — tính thành việc riêng.', 'ok');
  }

  /* ============================ Hộp thoại: chuyển trạng thái ============================ */

  function flow(itemId, to, opts) {
    opts = opts || {};
    var i = U.byId(st().items, 'item_id', itemId);
    if (!i) return;
    var tr = actionsFor(i).filter(function (a) { return a.to === to; })[0];
    if (!tr) {
      var currentLabel = D.STATUS[i.status] ? D.STATUS[i.status].label : i.status;
      ui.toast('Không thể thực hiện thao tác này khi hồ sơ đang ở trạng thái ' + currentLabel + '. Hãy tải lại danh sách.', 'err');
      return;
    }

    var r = reqOf(i), wt = wtOf(i);
    // Giữ lại trạng thái tại lúc mở hộp thoại để nếu màn hình bị đồng bộ lại
    // trong lúc người dùng đang nhập, lỗi sẽ được báo là xung đột phiên bản
    // thay vì rơi vào thông báo mơ hồ "Thao tác không hợp lệ".
    var body = '<form data-form="flow" data-id="' + U.attr(itemId) + '" data-to="' + U.attr(to) + '" data-from="' + U.attr(i.status) + '" data-version="' + U.attr(i.version) + '">';

    body += '<div class="banner banner-info flow-context">' + U.icon('arrow', 17) +
      '<div><div class="flow-title"><b>' + U.esc(r ? r.customer.name : '') + '</b><span class="t2">' + U.esc(wtGroup(i.work_type_code)) + '</span></div>' +
      '<div class="flow-status" aria-label="Trạng thái phân công">' + ui.statusTag(i.status) + ' <span aria-hidden="true">&rarr;</span> ' + ui.statusTag(to) + '</div></div></div>';

    if (tr.assignee) {
      var staff = staffList();
      if (!staff.length) { ui.toast('Chưa có cán bộ LS đang hoạt động.', 'err'); return; }
      var rec = assignmentRecommendation(i);
      var loadRows = staff.map(function (x) {
        var load = staffLoad(x.user_id);
        return {
          cells: [
            '<div class="t1">' + U.esc(x.full_name) + '</div><div class="t2">' + U.esc(unitName(x.unit_id)) + '</div>',
            '<span class="tid">' + load.open + '</span>',
            load.late ? ui.tag(String(load.late), 'danger') : '<span class="t2">0</span>',
            '<span class="tid">' + load.done + '</span>'
          ]
        };
      });
      body += '<div style="margin-top:1rem">' + ui.field('Cán bộ phụ trách',
        ui.select('assignee', staff.map(function (x) {
          var load = staffLoad(x.user_id);
          return [x.user_id, x.full_name + ' — đang mở ' + load.open + ' việc'];
        }), (rec ? rec.user.user_id : i.assigned_user_id), { attrs: ' required' })) +
        '<div style="margin-top:.75rem">' + ui.table(

    body += ui.formEnd(tr.label, { danger: to === 'HUY' }) + '</form>';
    ui.openDialog(tr.label, body, { sub: i.item_id });

  function quickAssign(itemId) {
    var i = U.byId(st().items, 'item_id', itemId);
    if (!i) return;
    var tr = actionsFor(i).filter(function (x) { return x.assignee; })[0];
    if (!tr) { ui.toast('Không thể đổi người ở trạng thái này.', 'warn'); return; }
    flow(itemId, tr.to, { quick: true });
  }

  function submitFlow(form) {
    var i = U.byId(st().items, 'item_id', form.getAttribute('data-id'));
    var to = form.getAttribute('data-to');
    if (!i) return;
    // Một lần bấm đã gửi lên GAS thì không cho form/dialog cũ gửi lại lần hai.
    // Trước đây lần bấm thứ hai thấy trạng thái lạc quan đã đổi và hiện
    // "Thao tác không hợp lệ", dù lần đầu vẫn đang được lưu đúng.
    if (i.syncing || form.getAttribute('data-waiting')) return;
    // Ô checklist vừa tích còn đang chờ lưu: chờ lưu xong rồi mới chuyển bước,
    // nếu không máy chủ thấy lệch phiên bản hoặc thấy chưa tích đủ.
    if (U.isGas() && checklistPending(i.item_id)) {
      form.setAttribute('data-waiting', '1');
      flushChecklist(i.item_id).then(function () {
        form.removeAttribute('data-waiting');
        var live = U.byId(st().items, 'item_id', i.item_id);
        if (live) form.setAttribute('data-version', String(live.version));
        submitFlow(form);
      });
      return;
    }
    var fromStatus = form.getAttribute('data-from') || i.status;
    var tr = actionsFor(i).filter(function (a) { return a.to === to; })[0];
    if (!tr) {
      var expectedFlow = (D.FLOW[fromStatus] || []).filter(function (a) { return a.to === to; })[0];
      var currentLabel = D.STATUS[i.status] ? D.STATUS[i.status].label : i.status;
      ui.toast(expectedFlow
        ? 'Hồ sơ vừa được cập nhật từ lúc mở hộp thoại (hiện là ' + currentLabel + '). Hãy đóng hộp thoại, tải lại rồi thao tác lại.'
        : 'Không thể thực hiện thao tác này khi hồ sơ đang ở trạng thái ' + currentLabel + '.', 'err');
      return;
    }

    var d = new FormData(form);
    var wt = wtOf(i), r = reqOf(i);
    if (wt && wt.checklist.length && ['DA_SOAN_XONG', 'HOAN_THANH_LS'].indexOf(to) !== -1 &&
        (i.checklist || []).filter(Boolean).length < wt.checklist.length) {
      ui.toast('Hãy tích đủ các nhóm việc trước khi hoàn thành toàn bộ hồ sơ.', 'err');
      return;
    }
    var ts = U.now();
    var reason = String(d.get('reason') || '').trim();
    var notificationMode = to === 'HOAN_THANH_LS' ? String(d.get('notification_mode') || 'IN_APP') : 'DEFAULT';

    if (tr.reason && tr.reason !== 'free') {
      var code = String(d.get('reason_code') || '');
      var picked = code ? U.byId(st().reasons, 'code', code) : null;
      if (!picked && !reason) { ui.toast('Chọn lý do hoặc ghi diễn giải.', 'err'); return; }
      reason = (picked ? picked.label : '') + (reason ? (picked ? ' — ' : '') + reason : '');
    }
    if (tr.reason === 'free' && !reason) { ui.toast('Thao tác này bắt buộc ghi lý do.', 'err'); return; }

    var assigneeId = '';
    if (tr.assignee) {
      assigneeId = String(d.get('assignee'));
      var staff = U.byId(st().users, 'user_id', assigneeId);
      if (!staff || staff.role !== 'CAN_BO_LS' || !staff.active) { ui.toast('Người nhận phải là cán bộ LS đang hoạt động.', 'err'); return; }
      reason = 'Giao ' + staff.full_name + (reason ? ' — ' + reason : '');
    }

    var appointment = null;
    if (tr.appointment) {
      var day = String(d.get('appt_date') || '');
      var hour = String(d.get('appt_time') || '');
      if (!day || !hour) { ui.toast('Chưa chọn ngày và giờ ký.', 'err'); return; }

      var place = D.signPlace(st());
      if (!place) { ui.toast('Quản trị chưa đặt nơi ký trong Cấu hình chung.', 'err'); return; }

      // Khách không có kênh nào thì chuyển sang nhắn nhóm nội bộ gắn thẻ cán bộ,
      // thay vì chặn lại — việc vẫn phải đi tiếp, chỉ đổi cách báo.
      var reach2 = D.customerReach(r, st());
      var chosen = String(d.get('appt_channel') || '');
      if (!chosen || reach2.available.indexOf(chosen) === -1) chosen = reach2.fallback;

      appointment = {
        at: new Date(day + 'T' + hour).toISOString(),
        date: day, time: hour, place: place,
        channel: chosen,
        via_group: reach2.available.length === 0,
        officer_id: i.assigned_user_id || ''
      };
      reason = 'Hẹn ký ' + U.fmtDate(day) + ' ' + hour + ' tại ' + place +
        (appointment.via_group ? ' — báo qua nhóm Zalo, gắn thẻ cán bộ phụ trách' : '');
    }

    // Ghi ngay lên màn hình trước khi gọi máy chủ: người phân giao việc không
    // phải ngồi chờ Sheet trả lời mới biết thao tác của mình có ăn hay không.
    var before = JSON.parse(JSON.stringify(i));
    var expected = i.version;

    if (tr.assignee) {
      i.assigned_user_id = assigneeId;
      i.assigned_by = st().session;
      i.assigned_at = ts;
      i.due_at = D.dueFrom(ts, i.work_type_code, st());
    }
    if (appointment) i.appointment = appointment;

    if ((to === 'CHO_PHAN_CONG' || to === 'DA_PHAN_CONG') && !i.accepted_at) i.accepted_at = ts;
    if (to === 'DANG_THUC_HIEN' && !i.processing_started_at) i.processing_started_at = ts;
    D.applyClock(i, to, ts);
    D.applySlaPause(i, to, ts, st());
    if (to === 'HOAN_THANH_LS') i.completed_at = ts;
    if (to === 'DANG_THUC_HIEN' && i.status === 'HOAN_THANH_LS') {
      // Mở lại là vòng xử lý mới: hạn tính lại từ lúc mở (khớp transitionItem).
      i.completed_at = '';
      i.due_at = D.dueFrom(ts, i.work_type_code, st());
    }
    if (tr.note && reason) i.note = reason;

    i.status = to;
    i.version = Number(i.version || 1) + 1;

    var ref = itemRef(i);
    ui.closeDialog();

    if (U.isGas()) {
      i.syncing = true;
      LS.app.render();
      ui.toast(tr.label + ' · ' + ref, 'ok');
      LS.app.background(
        LS.api.transitionItem(i.item_id, to, {
          reason: reason, assignee_id: assigneeId, appointment: appointment,
          expected_version: expected, notification_mode: notificationMode
        }),
        {
          label: tr.label,
          onOk: function (result) {
            // Trước đây chỉ gỡ cờ mà không vẽ lại: dòng việc cứ hiện "đang gửi",
            // không có nút bước kế tiếp cho tới khi người dùng tự tải lại trang.
            var live = U.byId(st().items, 'item_id', i.item_id) || i;
            live.syncing = false;
            if (result && result.version) live.version = result.version;
            // Hạn do máy chủ tính (lùi hạn sau khi chờ, mở lại) là số chuẩn.
            ['due_at', 'completed_at', 'sla_paused_at'].forEach(function (k) {
              if (result && result[k] !== undefined) live[k] = result[k];
            });
            if (!ui.dialogOpen()) LS.app.render();
            else if (detailShowing(live.item_id)) detail(live.item_id);
          },
          rollback: function () {
            var live = U.byId(st().items, 'item_id', before.item_id);
            if (live) Object.keys(before).forEach(function (k) { live[k] = before[k]; });
          }
        }
      );
      return;
    }

    logEvent(i.item_id, to, reason || tr.label);
    var sent = notificationMode === 'NONE' ? [] : (tr.notify ? D.queueNotifications(i, tr.notify, st(), st().session, notificationMode) : []);
    U.save();
    LS.app.render();

    var blocked = sent.filter(function (x) { return x.status === 'KHONG_GUI'; }).length;
    ui.toast(tr.label + ' · ' + ref + (blocked ? ' — ' + blocked + ' tin không gửi được' : ''), blocked ? 'warn' : 'ok');
  }

      ui.field('Sản phẩm', ui.select('work_type_code', productOptions((wtOf(i) && (wtOf(i).group || wtOf(i).name)) || '', i.work_type_code), i.work_type_code, { attrs: ' data-role="work-type-product" required' }), 'chọn sản phẩm thuộc đúng loại việc') +

  }

  function submitEdit(form) {
    var i = U.byId(st().items, 'item_id', form.getAttribute('data-id'));
    if (!i || !canEdit(i)) { ui.toast('Không có quyền sửa việc này.', 'err'); return; }
    var r = reqOf(i);
    var d = new FormData(form);
    var reason = String(d.get('reason')).trim();
    var changes = {};
    var selectedWt = U.byId(st().workTypes, 'code', String(d.get('work_type_code') || ''));
    if (!selectedWt || (selectedWt.group || selectedWt.name) !== String(d.get('work_type_group') || '')) {
      ui.toast('Sản phẩm không thuộc loại việc đã chọn.', 'err'); return;
    }

    ['work_type_code', 'occurrence_date'].forEach(function (k) {
      var v = String(d.get(k));
      if (v !== String(i[k])) changes[k] = v;
    });
    var selectedProduct = selectedWt ? selectedWt.name : '';
    if (selectedProduct !== String(i.product_name || '')) changes.product_name = selectedProduct;
    ['name', 'cif', 'phone', 'email'].forEach(function (k) {
      var v = String(d.get('customer.' + k) || '').trim();
      if (v !== String(r.customer[k] || '')) changes['customer.' + k] = v;
    });

    if (!Object.keys(changes).length) { ui.toast('Không có thay đổi nào.', 'warn'); return; }

    if (U.isGas()) {
      LS.api.proposeRevision(i.item_id, changes, reason, i.version).then(function (result) {
        ui.closeDialog();
        return LS.app.refreshServer(result.applied ? 'Đã lưu thay đổi.' : 'Đã gửi đề nghị sửa cho kiểm soát.');
      }).catch(function (error) { ui.toast(error.message || 'Không thể lưu thay đổi.', 'err'); });
      return;
    }

    if (editNeedsApproval(i)) {
      if (i.pending) { ui.toast('Việc đang có một đề nghị sửa chờ kiểm soát duyệt.', 'err'); return; }
      i.pending = { fields: changes, by: st().session, at: U.now(), reason: reason };
      logEvent(i.item_id, 'DE_NGHI_SUA', reason);
      D.queueNotifications(i, 'DE_NGHI_SUA', st(), st().session);
      ui.toast('Đã gửi đề nghị sửa cho kiểm soát.');
    } else {
      applyChanges(i, changes);
      i.version += 1;
      logEvent(i.item_id, 'SUA_THONG_TIN', reason + ' (' +
        Object.keys(changes).map(function (k) { return FIELD_LABEL[k] || k; }).join(', ') + ')');
      ui.toast('Đã lưu thay đổi.');
    }
    U.save();
    ui.closeDialog();
    LS.app.render();
  }

  function applyChanges(item, changes) {
    var r = reqOf(item);
    Object.keys(changes).forEach(function (k) {
      if (k.indexOf('customer.') === 0) r.customer[k.slice(9)] = changes[k];
      else item[k] = changes[k];
    });
    if (changes.work_type_code) {
      // Checklist thuộc loại việc: đổi loại thì làm lại checklist của loại mới (khớp applyRevision_).
      var wt = wtOf(item);
      item.checklist = (wt ? wt.checklist : []).map(function () { return false; });
      if (item.assigned_at) item.due_at = D.dueFrom(item.assigned_at, item.work_type_code, st());
    }
    if (r.customer.cif) r.customer.kind = 'DA_CO_CIF';
  }

  function revision(itemId, approve) {
    var i = U.byId(st().items, 'item_id', itemId);
    if (!i || !i.pending) return;
    if (['KS_LS', 'QUAN_LY_LS'].indexOf(me().role) === -1) { ui.toast('Chỉ kiểm soát được duyệt.', 'err'); return; }

    if (U.isGas()) {
      LS.api.resolveRevision(itemId, approve, '').then(function () {
        return LS.app.refreshServer(approve ? 'Đã áp dụng thay đổi.' : 'Đã từ chối đề nghị.');
      }).catch(function (error) { ui.toast(error.message || 'Không thể duyệt đề nghị.', 'err'); });
      return;
    }

    if (approve && !(D.STATUS[i.status] && D.STATUS[i.status].open)) {
      ui.toast('Việc đã đóng từ lúc gửi đề nghị; chỉ có thể từ chối.', 'err'); return;
    }
    if (approve) {
      applyChanges(i, i.pending.fields);
      i.version += 1;
      logEvent(itemId, 'DUYET_SUA', 'Duyệt đề nghị của ' + userName(i.pending.by) + '.');
      ui.toast('Đã áp dụng thay đổi.');
    } else {
      logEvent(itemId, 'TU_CHOI_SUA', 'Từ chối đề nghị của ' + userName(i.pending.by) + '.');
      ui.toast('Đã từ chối đề nghị.');
    }
    i.pending = null;
    U.save();
    LS.app.render();
  }

  /* ============================ Hộp thoại: đăng ký việc mới ============================ */

  function catalogOptions(key, unitId) {
    var rows = (st().catalogOptions || []).filter(function (x) {
      return x.catalog_key === key && x.active && (!unitId || !x.unit_id || x.unit_id === unitId);
    }).sort(function (a, b) { return (a.sort_order || 9999) - (b.sort_order || 9999); });
    return rows;
  }

  function workTypeGroups() {
    var seen = {};
    return st().workTypes.filter(function (w) { return w.active; }).sort(function (a, b) {
      return (a.sort_order || 9999) - (b.sort_order || 9999);
    }).reduce(function (out, w) {
      var group = w.group || w.name;
      if (!seen[group]) { seen[group] = true; out.push([group, group]); }
      return out;
    }, []);
  }

  function productOptions(group, selectedCode) {
    return st().workTypes.filter(function (w) {
      return w.active && (!group || (w.group || w.name) === group);
    }).sort(function (a, b) {
      return (a.sort_order || 9999) - (b.sort_order || 9999);
    }).map(function (w) { return [w.code, w.name]; });
  }

  function defaultWorkTypeGroup() {
    var groups = workTypeGroups();
    return groups.length ? groups[0][0] : '';
  }

  // Chỉ nhóm công việc tín dụng có thể phát sinh lựa chọn TSBĐ. Nhóm TSĐB
  // bản thân đã là hồ sơ tài sản, không hỏi lại để tránh tạo nghĩa vụ kép.
  function canChooseCollateralMode(w) {
    return !!(w && w.active && ['Món', 'HM SXKD', 'Thấu chi', 'Thẻ tín dụng'].indexOf(w.group || '') !== -1);
  }

  function defaultCollateralMode(w) {
    if (!canChooseCollateralMode(w)) return 'NONE';
    if (/TSĐB|TSDB|Có TSĐB/i.test(String(w.name || ''))) return 'CO_SAN';
    return 'NONE';
  }

  function collateralOptions(w) {
    if (!canChooseCollateralMode(w)) return [];
    return [
      ['NONE', 'Không có TSBĐ — chỉ Hợp đồng tín dụng'],
      ['CO_SAN', 'TSBĐ có sẵn — chỉ Hợp đồng tín dụng'],
      ['MOI', 'TSBĐ mới — tạo thêm hồ sơ tài sản']
    ];
  }

  function syncProductOptions(groupSelect, selectedCode) {
    var row = groupSelect && groupSelect.closest('.row-item');
    var product = row && row.querySelector('[data-role="work-type-product"]');
    if (!product) return;
    var options = productOptions(groupSelect.value, selectedCode);
    product.innerHTML = '<option value="">Chọn sản phẩm</option>' + options.map(function (op) {
      return '<option value="' + U.attr(op[0]) + '"' + (String(op[0]) === String(selectedCode || '') ? ' selected' : '') + '>' + U.esc(op[1]) + '</option>';
    }).join('');
    syncCollateralMode(product);
  }

  function syncCollateralMode(productSelect, selectedMode) {
    var row = productSelect && productSelect.closest('.row-item');
    var modeField = row && row.querySelector('[data-role="collateral-mode-field"]');
    var modeSelect = row && row.querySelector('[data-role="collateral-mode"]');
    if (!modeField || !modeSelect) return;
    var wt = U.byId(st().workTypes, 'code', productSelect.value);
    var options = collateralOptions(wt);
    modeSelect.innerHTML = options.map(function (op) {
      return '<option value="' + U.attr(op[0]) + '">' + U.esc(op[1]) + '</option>';
    }).join('');
    if (!options.length) {
      modeSelect.value = 'NONE';
      modeField.hidden = true;
      return;
    }
    modeField.hidden = false;
    modeSelect.value = selectedMode || defaultCollateralMode(wt);
  }

  function rowCollateralMode(row, wt) {
    if (!canChooseCollateralMode(wt)) return 'NONE';
    var field = row && row.querySelector('[data-role="collateral-mode-field"]');
    var select = row && row.querySelector('[data-role="collateral-mode"]');
    if (!field || field.hidden) return 'NONE';
    var mode = String(select && select.value || defaultCollateralMode(wt)).toUpperCase();
    return ['NONE', 'CO_SAN', 'MOI'].indexOf(mode) !== -1 ? mode : defaultCollateralMode(wt);
  }

  function rowForm(idx) {
    var defaultGroup = defaultWorkTypeGroup();
    return '<div class="row-item">' +
      ui.field('Loại việc', ui.select('wg_' + idx, workTypeGroups(), defaultGroup, { attrs: ' data-role="work-type-group" required' })) +
      ui.field('Sản phẩm', ui.select('wt_' + idx, productOptions(defaultGroup), '', { blank: 'Chọn sản phẩm', attrs: ' data-role="work-type-product" required' })) +
      '<div data-role="collateral-mode-field" hidden style="grid-column:1/-1">' +
      ui.field('Tình trạng TSBĐ', ui.select('cm_' + idx, [], '', { attrs: ' data-role="collateral-mode"' }), 'Chọn TSBĐ có sẵn nếu chỉ làm Hợp đồng tín dụng; chọn TSBĐ mới nếu phải lập thêm hồ sơ tài sản.') +
      '</div>' +
      ui.field('Ngày phát sinh', ui.input('dt_' + idx, U.localDate(), { type: 'date', required: true })) +
      ui.iconBtn('trash', { act: 'del-row', label: 'Xóa dòng việc' }) +
      '</div>';
  }

  function newRequest() {
    var u = me() || { full_name: '', unit_id: '' };
    // Kiểm soát LS đăng ký hộ phải chọn phòng gửi; phòng/PGD luôn là đơn vị của mình.
    var senderUnits = st().units.filter(function (x) { return x.active && x.kind === 'PGD'; })

      '<div style="margin-top:1rem">' + ui.sectionTitle('Mức ưu tiên') +

      ui.checkbox('priority_vip', false, 'Khách hàng VIP') +
      ui.checkbox('priority_important', false, 'Quan trọng') +
      ui.checkbox('priority_urgent', false, 'Xử lý gấp') +
      '</div></div>' +

      '<div style="margin-top:1.25rem">' + ui.sectionTitle('Danh sách việc') +

      ui.btn('Thêm dòng việc', { act: 'add-row', icon: 'plus', sm: true, kind: 'line' }) +
      '</div>' +

      '<div style="margin-top:1.25rem">' +
      ui.field('Ghi chú cho LS', ui.textarea('note', '', { placeholder: 'Thông tin cần kiểm soát lưu ý' })) +
      '</div>' +
      ui.formEnd('Gửi sang LS') + '</form>',
      { size: 'md', sub: 'Một hồ sơ, nhiều việc' });
    var firstGroup = document.querySelector('#dialog [data-role="work-type-group"]');

  function submitNewRequest(form) {
    var u = me();
    var d = new FormData(form);
    var rows = form.querySelectorAll('.row-item');
    if (!rows.length) { ui.toast('Cần ít nhất một dòng việc.', 'err'); return; }

    var unitId = u.role === 'PHONG_PGD' ? u.unit_id : String(d.get('unit_id') || '');
    if (!unitId) { ui.toast('Chọn phòng / PGD gửi hồ sơ.', 'err'); return; }
    var cif = String(d.get('cif') || '').trim();
    var kind = cif ? 'DA_CO_CIF' : 'KH_MOI';
    var payload = {
      unit_id: unitId,
      customer: {
        name: String(d.get('name')).trim(), kind: kind,
        cif: cif,
        phone: String(d.get('phone') || '').trim(), email: String(d.get('email') || '').trim(),
        priority_flags: ['VIP', 'QUAN_TRONG', 'XU_LY_GAP'].filter(function (x, idx) { return d.get(['priority_vip', 'priority_important', 'priority_urgent'][idx]) !== null; })
      },
      requestor: { id: u && u.user_id ? u.user_id : '', name: u && u.full_name ? u.full_name : '', kind: u && u.role ? u.role : 'VRM_PRM' },
      note: String(d.get('note') || '').trim(), items: []
    };
    Array.prototype.forEach.call(rows, function (row) {
      var group = row.querySelector('[data-role="work-type-group"]');
      var product = row.querySelector('[data-role="work-type-product"]');
      var date = row.querySelector('[name^="dt_"]');
      var wt = U.byId(st().workTypes, 'code', product.value);
      payload.items.push({
        work_type_code: product.value,
        product_name: wt ? wt.name : '',
        work_type_group: group.value,
        collateral_mode: rowCollateralMode(row, wt),
        occurrence_date: date.value
      });
    });
    if (!payload.customer.name || payload.items.some(function (item) {
      var wt = U.byId(st().workTypes, 'code', item.work_type_code);
      return !item.work_type_code || !item.product_name || !item.occurrence_date || !wt || (wt.group || wt.name) !== item.work_type_group;
    })) {
      ui.toast('Hãy điền đủ khách hàng, loại việc, sản phẩm và ngày phát sinh.', 'err'); return;
    }
    if (U.isGas()) {
      // Dựng ngay dòng tạm trên màn hình rồi mới gọi máy chủ. Mã việc thật do
      // máy chủ cấp nên dòng tạm bị khóa thao tác cho tới khi có mã trả về.
      var tmpReq = 'TAM_REQ_' + Date.now().toString(36).toUpperCase();
      var tmpIds = [];

      st().requests.unshift({
        request_id: tmpReq, unit_id: unitId, created_by: u.user_id, created_at: U.now(),
        note: payload.note, customer: payload.customer, requestor: payload.requestor
      });

      payload.items.forEach(function (it, idx) {
        var wt = U.byId(st().workTypes, 'code', it.work_type_code);
        var tmpId = tmpReq + '_' + (idx + 1);
        tmpIds.push(tmpId);
        st().items.unshift({
          item_id: tmpId, request_id: tmpReq, work_type_code: it.work_type_code,
          product_name: it.product_name, occurrence_date: it.occurrence_date,
          status: 'CHO_TIEP_NHAN', assigned_user_id: '', assigned_by: '',
          submitted_at: U.now(), accepted_at: '', assigned_at: '', due_at: '', completed_at: '', processing_started_at: '',
          appointment: null, checklist: (wt ? wt.checklist : []).map(function () { return false; }),
          note: '', pending: null, version: 1, collateral_mode: it.collateral_mode || 'NONE', parent_item_id: '', syncing: true
        });
      });

      ui.closeDialog();
      LS.app.render();
      ui.toast('Đang gửi ' + payload.items.length + ' việc sang LS…', 'ok');

      LS.app.background(LS.api.createRequest(payload), {
        label: 'Đăng ký việc mới',
        onOk: function (result) {
          var ids = (result && result.item_ids) || [];
          var req = U.byId(st().requests, 'request_id', tmpReq);
          if (req) req.request_id = result.request_id;
          tmpIds.forEach(function (tmp, idx) {
            var row = U.byId(st().items, 'item_id', tmp);
            if (!row) return;
            row.item_id = ids[idx] || tmp;
            row.request_id = result.request_id;
            row.syncing = false;
          });
          (result && result.linked_items || []).forEach(function (child) {
            st().items.unshift({
              item_id: child.item_id, request_id: result.request_id, parent_item_id: child.parent_item_id || '',
              work_type_code: child.work_type_code, product_name: child.product_name,
              occurrence_date: child.occurrence_date, status: child.status || 'CHO_TIEP_NHAN',
              assigned_user_id: child.assigned_user_id || '', assigned_by: child.assigned_by || '',
              submitted_at: child.submitted_at || '', accepted_at: child.accepted_at || '', assigned_at: child.assigned_at || '',
              due_at: child.due_at || '', completed_at: child.completed_at || '', processing_started_at: child.processing_started_at || '',
              appointment: null, checklist: child.checklist || [], note: child.note || '', pending: null,
              version: Number(child.version) || 1, collateral_mode: child.collateral_mode || 'MOI', syncing: false
            });
          });
          LS.app.render();
          ui.toast('Đã gửi ' + (ids.length || payload.items.length) + ' việc sang LS.', 'ok');
        },
        rollback: function () {
          st().requests = st().requests.filter(function (r) { return r.request_id !== tmpReq; });
          st().items = st().items.filter(function (i) { return tmpIds.indexOf(i.item_id) === -1; });
        }
      });
      return;
    }

    var reqId = U.uid('REQ');

    st().requests.unshift({
      request_id: reqId, unit_id: unitId, created_by: u.user_id, created_at: U.now(),
      note: String(d.get('note') || '').trim(),
      customer: {
        name: String(d.get('name')).trim(), kind: kind,
        cif: cif,
        phone: String(d.get('phone') || '').trim(),
        email: String(d.get('email') || '').trim(),
        priority_flags: payload.customer.priority_flags
      },
      requestor: { id: u.user_id, kind: u.role || 'VRM_PRM', name: u.full_name || '' }
    });

    var n = 0;
    Array.prototype.forEach.call(rows, function (row) {
      var sel = row.querySelector('[data-role="work-type-product"]');
      var date = row.querySelector('[name^="dt_"]');
      var wt = U.byId(st().workTypes, 'code', sel.value);
      var id = U.uid('ITEM');
      st().items.unshift({
        item_id: id, request_id: reqId, work_type_code: sel.value,
        product_name: wt ? wt.name : '', occurrence_date: date.value,
        status: 'CHO_TIEP_NHAN', assigned_user_id: '', assigned_by: '',
        submitted_at: U.now(), accepted_at: '', assigned_at: '', due_at: '', completed_at: '', processing_started_at: '',
        appointment: null, checklist: (wt ? wt.checklist : []).map(function () { return false; }),
        note: '', pending: null, version: 1, collateral_mode: rowCollateralMode(row, wt), parent_item_id: ''
      });
      logEvent(id, 'TAO_VIEC', unitName(unitId) + ' đăng ký yêu cầu.');
      if (rowCollateralMode(row, wt) === 'MOI') {
        var collateralType = U.byId(st().workTypes, 'code', 'LEGACY_26');
        if (collateralType) {
          var childId = U.uid('ITEM');
          st().items.unshift({
            item_id: childId, request_id: reqId, parent_item_id: id, work_type_code: collateralType.code,
            product_name: collateralType.name, occurrence_date: date.value, status: 'CHO_TIEP_NHAN',
            assigned_user_id: '', assigned_by: '', submitted_at: U.now(), accepted_at: '', assigned_at: '', due_at: '',
            completed_at: '', processing_started_at: '', appointment: null,
            checklist: (collateralType.checklist || []).map(function () { return false; }), note: '', pending: null,
            version: 1, collateral_mode: 'MOI'
          });
          logEvent(childId, 'TAO_VIEC', 'Tạo hồ sơ TSBĐ mới đi kèm việc ' + id + '.');
        }
      }
      n += 1;
    });

    U.save();
    ui.closeDialog();
    LS.app.render();
    ui.toast('Đã gửi ' + n + ' việc sang LS.');
  }

  /* ============================ Xuất dữ liệu ============================ */

  function exportCsv() {
    var u = me();
    if (['QUAN_LY_LS', 'ADMIN'].indexOf(u.role) === -1) { ui.toast('Không có quyền xuất báo cáo.', 'err'); return; }
    var limit = st().settings.export_row_limit;
    var q = function (v) { return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"'; };
    var rows = [['ma_su_kien', 'ma_viec', 'su_kien', 'nguoi_thuc_hien', 'thoi_gian', 'noi_dung'].join(',')];

    visibleEvents().slice(0, limit).forEach(function (e) {
      rows.push([e.event_id, e.item_id, D.label(e.type), userName(e.by) || e.by, U.fmtDT(e.at), e.reason].map(q).join(','));
    });

    LS.app.download('nhat_ky_ls_' + U.localDate() + '.csv', rows.join('\r\n'), 'text/csv');
    // Xuất báo cáo cũng phải lưu vết: ai xuất, lúc nào, bao nhiêu dòng.
    LS.admin.logCfg('Báo cáo', 'Xuất nhật ký CSV, ' + (rows.length - 1) + ' dòng.');
    U.save();
    ui.toast('Đã xuất ' + (rows.length - 1) + ' dòng.');
  }

  /* ============================ Quét quá hạn ============================ */

  /** Chạy một lần mỗi phiên: việc vừa quá hạn thì phát thông báo theo quy tắc. */
  function sweepOverdue() {
    var changed = false;
    st().items.forEach(function (i) {
      var s = D.sla(i, st());
      if (!s || !s.late) return;
      var made = D.queueNotifications(i, 'QUA_HAN', st(), null);
      if (made.length) changed = true;
    });
    if (changed) U.save();
  }

  return {
    work: work, room: room, roomBoard: roomBoard, queue: queue, mine: mine, personalDashboard: personalDashboard, board: board, periods: periods, audit: audit,
    report: report, exportReport: exportReport, refreshReport: refreshReport, setReportFilter: setReportFilter,
    headerSummary: headerSummary,
    detail: detail, saveChecklistToggle: saveChecklistToggle, addLinked: addLinked, toggleLinkedBox: toggleLinkedBox, flow: flow, quickAssign: quickAssign, submitFlow: submitFlow,
    openBatchAssign: openBatchAssign, submitBatchAssign: submitBatchAssign,
    editItem: editItem, submitEdit: submitEdit, revision: revision,
    newRequest: newRequest, submitNewRequest: submitNewRequest, rowForm: rowForm, syncProductOptions: syncProductOptions, syncCollateralMode: syncCollateralMode,
    exportCsv: exportCsv, downloadDailyImage: downloadDailyImage, exportBoard: exportBoard, sweepOverdue: sweepOverdue,
    visibleItems: visibleItems, setFilter: setFilter, toggleSort: toggleSort, resetFilters: resetFilters, resetFilter: resetFilter, openFilter: openFilter, setDraftFilter: setDraftFilter, applyFilter: applyFilter, applyReportFilter: applyReportFilter,
    staffList: staffList, userName: userName, unitName: unitName, itemLabel: itemLabel, itemRef: itemRef,
    roomShowBacklog: roomShowBacklog
  };
})();

/* js/admin.js?v=20260922-adminscore-v1 */
/**
 * admin.js — bảng quản trị: kênh gửi tin, mẫu tin, quy tắc thông báo, hàng đợi,
 * danh mục, lịch làm việc, cấu hình hệ thống và nhật ký cấu hình.
 */
LS.admin = (function () {
  'use strict';

  var U = LS, D = LS.domain, ui = LS.ui;
  var section = 'overview';
  var oFilter = { status: '', channel: '' };

  /* Điểm vận hành có thể tạm ẩn khỏi Tổng quan (vd. khi chiếu màn hình). Chỉ là
     tuỳ chọn hiển thị của trình duyệt này — không đổi dữ liệu hay quyền. */
  var SCORE_HIDE_KEY = 'ls_admin_hide_scorecard';
  var scoreHidden = (function () {
    try { return window.localStorage.getItem(SCORE_HIDE_KEY) === '1'; } catch (e) { return false; }
  })();

  function setScoreHidden(hidden) {
    scoreHidden = !!hidden;
    try { window.localStorage.setItem(SCORE_HIDE_KEY, scoreHidden ? '1' : '0'); } catch (e) { /* chỉ mất ghi nhớ, vẫn ẩn/hiện được */ }
  }

  function st() { return U.db(); }
  function me() { return U.byId(st().users, 'user_id', st().session); }
  function userName(id) { var u = U.byId(st().users, 'user_id', id); return u ? u.full_name : id; }

  /** Mọi thay đổi cấu hình đều phải lưu vết — ai, lúc nào, đổi gì. */

    st().configLog.unshift({ id: U.uid('CFG'), at: U.now(), by: st().session, area: area, detail: detail });

  function commit(area, detail, msg) {

  /* ============================ Điều hướng ============================ */

  var NAV = [
    ['Giám sát', [
      ['overview', 'Tổng quan', 'activity'],
      ['outbox', 'Hàng đợi gửi', 'send'],
      ['metrics', 'Chi phí & hiệu quả', 'chart'],
      ['cfglog', 'Nhật ký cấu hình', 'history']
    ]],

      ['channels', 'Kênh gửi tin', 'zap'],

      ['types', 'Loại việc', 'tag'],

    ]]

  function setSection(s) { section = s; }

  function nav() {
    var h = D.outboxHealth(st());
    var alerts = {
      outbox: h.failed + h.waiting,
      channels: st().channels.filter(function (c) { return D.CHANNELS[c.code] && !D.channelUsable(c.code, st()); }).length,

    };

  function view() {
    var body;
    switch (section) {
      case 'channels': body = channels(); break;
      case 'templates': body = templates(); break;
      case 'rules': body = rules(); break;
      case 'outbox': body = outbox(); break;
      case 'metrics': body = metrics(); break;
      case 'types': body = types(); break;
      case 'units': body = units(); break;
      case 'users': body = users(); break;
      case 'reasons': body = reasons(); break;

      default: body = overview();
    }
    return '<div class="admin">' + nav() + '<div class="admin-body">' + body + '</div></div>';
  }

  /* ============================ Tổng quan ============================ */

  function overview() {
    var s = st();
    var h = D.outboxHealth(s);
    var notReady = s.channels.filter(function (c) { return !D.channelUsable(c.code, s); });
    var openItems = s.items.filter(function (i) { return D.STATUS[i.status].open; });
    var late = openItems.filter(function (i) { var x = D.sla(i, s); return x && x.late; });
    var email = U.byId(s.channels, 'code', 'EMAIL') || { config: {} };
    var emailQuota = Number(email.config.daily_quota || 0);
    var quotaLeft = emailQuota - D.emailUsedToday(email.config);
    var pendingTpl = s.templates.filter(function (t) { return t.status === 'CHO_DUYET'; });
    var plan = s.activePlan || {};
    var month = D.monthKey(new Date());
    var scores = s.operationalScorecard && s.operationalScorecard.length
      ? s.operationalScorecard
      : D.operationalScorecard(plan.start_date || (month + '-01'), plan.end_date || (month + '-31'), s);
    function finiteScore(value) {
      var score = Number(value);
      return isFinite(score) ? score : null;
    }
    var scored = scores.filter(function (x) { return finiteScore(x.score) !== null; });

    var out = '';

    if (s.settings.env === 'THU_NGHIEM') {
      out += ui.banner('warn', 'Hệ thống đang ở môi trường thử nghiệm',
        'THU_NGHIEM');
    }

    out += ui.strip([
      ui.metric('Tin chờ gửi', h.backlog, h.backlog > s.settings.backlog_alert ? 'danger' : ''),
      ui.metric('Tin thất bại', h.failed, h.failed ? 'danger' : ''),
      ui.metric('Chờ cán bộ xác nhận', h.waiting, h.waiting ? 'warn' : ''),
      ui.metric('Không gửi được', h.skipped, h.skipped ? 'warn' : ''),
      ui.metric('Việc quá hạn', late.length, late.length ? 'danger' : '')
    ]);

    out += scoreHidden ? scoreHiddenBlock(scores.length, (s.operationalScoreSnapshots || []).length) : scoreBlocks(s, scores, finiteScore);
    return out + overviewRest(s, h, notReady, emailQuota, quotaLeft, pendingTpl);
  }

  function scoreHiddenBlock(liveCount, snapshotCount) {
    return ui.block({
      title: 'Điểm vận hành đang ẩn', icon: 'eye-off',
      actions: ui.btn('Hiện điểm vận hành', { act: 'admin-score-toggle', data: ' data-hide="0"', sm: true, kind: 'primary', icon: 'eye' }),
      body: ui.pad('<p class="t2">Bảng điểm ' + liveCount + ' cán bộ và ' + snapshotCount +
        ' dòng lịch sử điểm đã chốt đang được ẩn trên trình duyệt này. Điểm vẫn được tính và chốt theo kỳ như bình thường.</p>')
    });
  }

  function scoreBlocks(s, scores, finiteScore) {
    var out = '';
    out += ui.block({
      title: 'Điểm vận hành', count: scores.length, icon: 'chart',
      actions: ui.btn('Tạm ẩn điểm', { act: 'admin-score-toggle', data: ' data-hide="1"', sm: true, icon: 'eye-off',
        title: 'Ẩn bảng điểm và lịch sử điểm khỏi Tổng quan' }),
      body: ui.table(
        [{ label: 'Cán bộ' }, { label: 'Đúng hạn', cls: 'num' }, { label: 'Hoàn thành', cls: 'num' }, { label: 'Tồn quá hạn', cls: 'num' }, { label: 'Điểm', cls: 'num' }],
        scores.map(function (x) {
          var score = finiteScore(x.score);
          var tone = score === null ? '' : (score >= 80 ? 'ok' : (score >= 60 ? 'warn' : 'danger'));
          return { cls: x.lateOpen ? 'flag-warn' : '', cells: [
            '<div class="t1">' + U.esc(x.user.full_name) + '</div>',
            score === null ? '<span class="t2">—</span>' : '<span class="tid">' + x.onTime + '/' + x.done + '</span>',
            score === null ? '<span class="t2">—</span>' : '<span class="tid">' + x.done + '/' + x.eligible + '</span>',
            score === null ? '<span class="t2">—</span>' : (x.lateOpen ? ui.tag(String(x.lateOpen), 'danger') : '<span class="tid">0</span>'),
            score === null ? '<span class="t2">Chưa có dữ liệu</span>' : ui.tag(String(score), tone)
          ] };
        }),
        { icon: 'users', title: 'Chưa có cán bộ LS', text: '' }
      )
    });

    var snapshots = (s.operationalScoreSnapshots || []).slice().sort(function (a, b) {
      return String(b.month_key || '').localeCompare(String(a.month_key || '')) ||
        String(b.captured_at || '').localeCompare(String(a.captured_at || '')) ||
        String(a.full_name || '').localeCompare(String(b.full_name || ''));
    });
    out += ui.block({
      title: 'Lịch sử điểm đã chốt', count: snapshots.length, icon: 'history',
      body: ui.table(
        [{ label: 'Kỳ', cls: 'fit' }, { label: 'Cán bộ' }, { label: 'Điểm', cls: 'num' },
          { label: 'Hoàn thành / đúng hạn', cls: 'fit' }, { label: 'Chất lượng dữ liệu' }, { label: 'Chốt lúc', cls: 'fit' }],
        snapshots.slice(0, 120).map(function (x) {
          var score = x.score === '' || x.score === null || x.score === undefined ? '—' : String(x.score);
          var tone = score === '—' ? '' : (Number(x.score) >= 80 ? 'ok' : (Number(x.score) >= 60 ? 'warn' : 'danger'));
          return { cells: [
            '<span class="tid">' + U.esc(x.month_key || '—') + '</span>',
            '<div class="t1">' + U.esc(x.full_name || x.user_id || '—') + '</div>',
            score === '—' ? '<span class="t2">—</span>' : ui.tag(score, tone),
            '<span class="tid">' + U.esc(String(x.done || 0)) + ' / ' + U.esc(String(x.on_time || 0)) + '</span>',
            '<span class="t2">' + U.esc(x.data_quality || 'DAT_CHUAN') + '</span>',
            '<span class="tid">' + U.fmtDT(x.captured_at || '') + '</span>'
          ] };
        }),
        { icon: 'chart', title: 'Chưa có snapshot', text: 'Điểm sẽ xuất hiện sau khi một kỳ được chốt.' }
      )
    });
    return out;
  }

  function overviewRest(s, h, notReady, emailQuota, quotaLeft, pendingTpl) {
    var out = '';
    var workerAt = String(s.settings.worker_last_run_at || '').trim();
    var workerStatus = String(s.settings.worker_last_run_status || '').trim();
    var workerTone = workerStatus === 'OK' ? 'ok' : (workerStatus ? 'warn' : '');
    out += ui.block({
      title: 'Worker thông báo', icon: 'activity',
      body: ui.pad(workerAt
        ? ui.kv([
          ['Trạng thái lần chạy gần nhất', ui.tag(workerStatus || 'CHƯA CÓ', workerTone)],
          ['Thời điểm', U.fmtDT(workerAt)],
          ['Đã gửi / lỗi / còn lại', String(s.settings.worker_last_run_sent || 0) + ' / ' + String(s.settings.worker_last_run_failed || 0) + ' / ' + String(s.settings.worker_last_run_remaining || 0)],
          ['Backup kho gần nhất', s.settings.backup_last_at ? U.fmtDT(s.settings.backup_last_at) : 'Chưa có']
        ])
        : ui.banner('warn', 'Worker chưa ghi nhận lần chạy', 'Trigger sẽ tự cài khi kho được mở lần đầu sau deploy.'))
    });

    out += ui.block({
      title: 'Tình trạng kênh gửi tin', icon: 'zap',
      actions: ui.btn('Mở cấu hình kênh', { act: 'admin-go', data: ' data-section="channels"', sm: true, icon: 'right' }),
      body: ui.table(
        [{ label: 'Kênh' }, { label: 'Trạng thái', cls: 'fit' }, { label: 'Điều kiện còn thiếu' }],
        s.channels.filter(function (c) { return D.CHANNELS[c.code]; }).map(function (c) {
          var def = D.CHANNELS[c.code];
          var rd = D.channelReady(c.code, s);
          var miss = rd.checks.filter(function (x) { return !x.ok; });
          return {
            cls: miss.length ? 'flag-warn' : '',
            cells: [
              '<div class="t1">' + U.esc(def.name) + '</div>',
              ui.tag(D.CHANNEL_STATUS[c.status].label, D.CHANNEL_STATUS[c.status].tone),
              miss.length
                ? '<div class="t2">' + miss.map(function (x) { return U.esc(x.label); }).join('<br>') + '</div>'
                : ui.tag('Đủ điều kiện', 'ok')
            ]
          };
        })
      )
    });

    var warnings = [];
    if (h.failed) warnings.push([h.failed + ' tin thất bại chưa xử lý', '']);
    if (h.backlog > s.settings.backlog_alert) warnings.push(['Hàng đợi vượt ngưỡng cảnh báo', '']);
    if (pendingTpl.length) warnings.push([pendingTpl.length + ' mẫu tin chờ duyệt', '']);
    if (emailQuota > 0 && quotaLeft <= 10) warnings.push(['Sắp hết hạn mức thư trong ngày', '']);
    if (notReady.length) warnings.push([notReady.length + ' kênh chưa sẵn sàng', '']);

    out += ui.block({
      title: 'Cảnh báo vận hành', count: warnings.length, icon: 'warn',
      body: warnings.length
        ? ui.pad('<div class="f-stack">' + warnings.map(function (w) {
          return ui.banner('warn', w[0], w[1]);
        }).join('') + '</div>')
        : ui.empty({ icon: 'check', title: 'Không có cảnh báo', text: 'Hàng đợi, kênh gửi và hạn xử lý đều trong ngưỡng.' })
    });

    return out;
  }

  function condAttrs(field) {
    if (!field.when) return '';
    var k = Object.keys(field.when)[0];
    return ' data-when="' + k + '=' + field.when[k] + '"';
  }

  function channelDialog(code) {
    var c = U.byId(st().channels, 'code', code);
    var def = D.CHANNELS[code];
    if (!c || !def) return;

    var fields = def.fields.map(function (fd) {
      var val = c.config[fd.key];
      var ctrl;
      if (fd.type === 'select') ctrl = ui.select('cfg.' + fd.key, fd.options, val, { attrs: ' data-cond="' + fd.key + '"' });
      else if (fd.type === 'bool') ctrl = ui.switchBox('cfg.' + fd.key, !!val, 'Đã hoàn tất');
      else if (fd.type === 'number') ctrl = ui.input('cfg.' + fd.key, val, { type: 'number', min: 0, disabled: fd.readonly });
      else ctrl = ui.input('cfg.' + fd.key, val, { placeholder: fd.placeholder, disabled: fd.readonly });
      return '<div' + condAttrs(fd) + '>' + ui.field(fd.label, ctrl, fd.hint) + '</div>';
    }).join('');

    ui.openDialog('Cấu hình ' + def.name,
      '<form data-form="channel" data-code="' + U.attr(code) + '">' +
      '<div>' + ui.sectionTitle('Kết nối') +
      '<div class="f-row">' + fields + '</div></div>' +

      '<div style="margin-top:1.125rem">' + ui.sectionTitle('An toàn khi gửi') +
      '<div class="f-stack">' +
      ui.checkbox('test_mode', c.test_mode, 'Chế độ thử nghiệm',
        'chỉ gửi cho người nhận trong danh sách dưới đây') +
      ui.field('Danh sách người nhận được phép',
        ui.textarea('allowlist', c.allowlist.join('\n'), { placeholder: 'mỗi dòng một email hoặc số điện thoại' }),
        'bỏ trống khi đã tắt chế độ thử nghiệm') +
      '<div class="f-row">' +
      ui.field('Giới hạn tin mỗi giờ', ui.input('rate_per_hour', c.rate_per_hour, { type: 'number', min: 0 })) +
      ui.field('Số lần gửi lại tối đa', ui.input('max_retry', c.max_retry, { type: 'number', min: 0, max: 10 })) +
      '</div></div></div>' +

      ui.formEnd('Lưu cấu hình') + '</form>',
      { size: 'md', sub: code });

    LS.app.applyConds();
  }

  function saveChannel(form) {
    var code = form.getAttribute('data-code');
    var c = U.byId(st().channels, 'code', code);
    var def = D.CHANNELS[code];
    var d = new FormData(form);

    def.fields.forEach(function (fd) {
      if (fd.readonly) return;
      var raw = d.get('cfg.' + fd.key);
      if (fd.type === 'bool') c.config[fd.key] = raw !== null;
      else if (fd.type === 'number') c.config[fd.key] = Number(raw || 0);
      else c.config[fd.key] = String(raw || '').trim();
    });

    c.test_mode = d.get('test_mode') !== null;
    c.allowlist = String(d.get('allowlist') || '').split('\n')
      .map(function (x) { return x.trim(); }).filter(Boolean);
    c.rate_per_hour = Number(d.get('rate_per_hour') || 0);
    c.max_retry = Number(d.get('max_retry') || 0);

    // Thiếu điều kiện thì tự hạ về chưa kích hoạt, không để trạng thái nói dối.
    var rd = D.channelReady(code, st());
    if (!rd.ok && c.status !== 'CHUA_KICH_HOAT') c.status = 'CHUA_KICH_HOAT';
    else if (rd.ok && c.status === 'CHUA_KICH_HOAT') c.status = c.test_mode ? 'THU_NGHIEM' : 'HOAT_DONG';
    else if (rd.ok && c.status !== 'TAM_NGUNG') c.status = c.test_mode ? 'THU_NGHIEM' : 'HOAT_DONG';

    if (U.isGas()) {
      LS.api.saveDelivery('channel', code, {
        status: c.status, test_mode: c.test_mode, allowlist: c.allowlist.join(','), rate_per_hour: c.rate_per_hour,
        max_retry: c.max_retry, config_json: JSON.stringify(c.config), updated_at: U.now()
      }).then(function () { ui.closeDialog(); return LS.app.refreshServer('Đã lưu cấu hình kênh.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể lưu cấu hình kênh.', 'err'); });
      return;
    }

    commit('Kênh gửi tin', 'Cập nhật cấu hình ' + def.name + ', trạng thái ' + c.status + '.');
  }

  function toggleChannel(code) {
    var c = U.byId(st().channels, 'code', code);
    var rd = D.channelReady(code, st());
    if (!rd.ok) { ui.toast('Kênh chưa đủ điều kiện để bật.', 'err'); LS.app.render(); return; }

    if (c.status === 'TAM_NGUNG' || c.status === 'CHUA_KICH_HOAT') c.status = c.test_mode ? 'THU_NGHIEM' : 'HOAT_DONG';
    else c.status = 'TAM_NGUNG';

    if (U.isGas()) {
      LS.api.saveDelivery('channel', code, {
        status: c.status, test_mode: c.test_mode, allowlist: c.allowlist.join(','), rate_per_hour: c.rate_per_hour,
        max_retry: c.max_retry, config_json: JSON.stringify(c.config), updated_at: U.now()
      }).then(function () { return LS.app.refreshServer(D.CHANNELS[code].name + ': ' + D.CHANNEL_STATUS[c.status].label); })
        .catch(function (error) { ui.toast(error.message || 'Không thể đổi trạng thái kênh.', 'err'); });
      return;
    }

    logCfg('Kênh gửi tin', D.CHANNELS[code].name + ' chuyển sang ' + c.status + '.');
    U.save();
    LS.app.render();
    ui.toast(D.CHANNELS[code].name + ': ' + D.CHANNEL_STATUS[c.status].label);
  }

  /** Cấu hình xong mà không kiểm chứng được thì "đã bật" mới chỉ là một cái công tắc. */
  function testChannel(code) {
    var c = U.byId(st().channels, 'code', code);
    var u = me();
    var addr = D.addressFor(code, {
      kind: 'NOI_BO', id: u.user_id, email: u.email || '',
      phone: u.zalo_phone || '', telegram: u.telegram_chat_id || ''
    });

    if (U.isGas()) {
      if (!addr) { ui.toast('Tài khoản của bạn chưa có địa chỉ nhận tin trên kênh này.', 'err'); return; }
      ui.confirm({
        title: 'Gửi tin thử qua ' + D.CHANNELS[code].name + '?',
        text: 'Tin thật sẽ được gửi tới ' + U.mask(addr) + ' qua nhà cung cấp đang cấu hình.',
        ok: 'Gửi thử',
        run: function () {
          LS.api.testChannel(code, addr).then(function (res) {
            return LS.app.refreshServer(res.status === 'DA_GUI'
              ? 'Đã gửi tin thử tới ' + U.mask(addr) + '.'
              : 'Tin thử chưa gửi được: ' + (res.note || res.status));
          }).catch(function (error) { ui.toast(error.message || 'Không gửi được tin thử.', 'err'); });
        }
      });
      return;
    }

    if (!addr) { ui.toast('Tài khoản của bạn chưa có địa chỉ nhận tin trên kênh này.', 'err'); return; }
    if (c.test_mode && c.allowlist.indexOf(addr) === -1) {
      ui.toast('Địa chỉ của bạn chưa có trong danh sách cho phép của kênh.', 'err');
      return;
    }

    st().outbox.unshift({
      outbox_id: U.uid('OUT'), idem_key: U.uid('TEST'), item_id: '', event: 'GUI_THU',
      audience: 'KS', channel: code, recipient_kind: 'NOI_BO', recipient: addr, recipient_name: u.full_name,
      template_code: '', body: 'Tin gửi thử từ màn quản trị LS-Routing.',
      status: 'CHO_GUI', note: '', retry: 0, provider_id: '', created_at: U.now(), sent_at: ''
    });

    logCfg('Kênh gửi tin', 'Gửi thử qua ' + D.CHANNELS[code].name + ' tới ' + U.mask(addr) + '.');
    U.save();
    section = 'outbox';
    LS.app.render();
    ui.toast('Đã xếp tin thử vào hàng đợi.');
  }

  /** Xem trước và kiểm tra biến cấm ngay khi gõ. */
  function hookTemplateLive() {
    var body = document.getElementById('tplBody');
    var chan = document.getElementById('tplChannel');
    if (!body || !chan) return;

    var refresh = function () {
      var tpl = { channel: chan.value, body: body.value };
      var chk = D.checkTemplate(tpl);
      document.getElementById('tplPreview').textContent = D.renderTemplate(body.value, sampleCtx());
      document.getElementById('tplErrors').innerHTML = tplErrorHtml(chk);
    };

    body.addEventListener('input', refresh);
    chan.addEventListener('change', refresh);
  }

  function insertVar(name) {
    var body = document.getElementById('tplBody');
    if (!body) return;
    var s = body.selectionStart, e = body.selectionEnd;
    var token = '{{' + name + '}}';
    body.value = body.value.slice(0, s) + token + body.value.slice(e);
    body.selectionStart = body.selectionEnd = s + token.length;
    body.focus();
    body.dispatchEvent(new Event('input'));
  }

  function saveTemplate(form) {
    var d = new FormData(form);
    var code = form.getAttribute('data-code');
    var tpl = {
      code: code || String(d.get('code')).trim().toUpperCase().replace(/[^A-Z0-9_]/g, '_'),
      name: String(d.get('name')).trim(),
      channel: String(d.get('channel')),
      subject: String(d.get('subject') || '').trim(),
      body: String(d.get('body'))
    };

    var chk = D.checkTemplate(tpl);
    if (!chk.ok) { ui.toast(chk.errors[0], 'err'); return; }

    if (U.isGas()) {
      var existing = code ? U.byId(st().templates, 'code', code) : null;
      var changed = existing && (existing.body !== tpl.body || existing.channel !== tpl.channel);
      LS.api.saveDelivery('template', tpl.code, {
        name: tpl.name, channel: tpl.channel, subject: tpl.subject, body: tpl.body,
        status: existing ? (changed && existing.status === 'DA_DUYET' ? 'CHO_DUYET' : existing.status) : 'CHO_DUYET',
        approved_by: changed ? '' : (existing ? existing.approved_by : ''), approved_at: changed ? '' : (existing ? existing.approved_at : '')
      }).then(function () { ui.closeDialog(); return LS.app.refreshServer('Đã lưu mẫu tin.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể lưu mẫu tin.', 'err'); });
      return;
    }

    if (code) {
      var ex = U.byId(st().templates, 'code', code);
      var changedBody = ex.body !== tpl.body || ex.channel !== tpl.channel;
      ex.name = tpl.name; ex.channel = tpl.channel; ex.subject = tpl.subject; ex.body = tpl.body;
      // Sửa nội dung thì mất hiệu lực duyệt cũ — mẫu phải đi duyệt lại.
      if (changedBody && ex.status === 'DA_DUYET') { ex.status = 'CHO_DUYET'; ex.approved_by = ''; ex.approved_at = ''; }
      commit('Mẫu tin', 'Sửa mẫu ' + ex.code + (changedBody ? ', chuyển về chờ duyệt lại.' : '.'));
    } else {
      if (U.byId(st().templates, 'code', tpl.code)) { ui.toast('Mã mẫu đã tồn tại.', 'err'); return; }
      tpl.status = 'CHO_DUYET';
      tpl.approved_by = ''; tpl.approved_at = '';
      st().templates.push(tpl);
      commit('Mẫu tin', 'Thêm mẫu ' + tpl.code + '.');
    }
  }

  function approveTemplate(code, ok) {
    var t = U.byId(st().templates, 'code', code);
    if (!t) return;
    if (U.isGas()) {
      LS.api.saveDelivery('template', code, {
        name: t.name, channel: t.channel, subject: t.subject, body: t.body, status: ok ? 'DA_DUYET' : 'TU_CHOI',
        approved_by: ok ? st().session : '', approved_at: ok ? U.now() : ''

    t.status = ok ? 'DA_DUYET' : 'TU_CHOI';

    U.save();

  function metrics() {
    var rows = st().notificationMetrics || [];
    var sent = rows.filter(function (m) { return m.status === 'SENT'; }).length;
    var failed = rows.filter(function (m) { return m.status === 'FAILED'; }).length;
    var skipped = rows.filter(function (m) { return m.status === 'KHONG_GUI'; }).length;
    var cost = rows.filter(function (m) { return m.status === 'SENT'; }).reduce(function (n, m) { return n + Number(m.unit_cost || 0); }, 0);
    var groups = {};
    rows.forEach(function (m) {
      var key = (m.month_key || 'Không rõ kỳ') + '|' + (m.channel || '—');
      if (!groups[key]) groups[key] = { month: m.month_key || '—', channel: m.channel || '—', queued: 0, sent: 0, failed: 0, skipped: 0, cost: 0, currency: m.currency || 'VND' };
      var g = groups[key];
      g.queued += 1;
      if (m.status === 'SENT') { g.sent += 1; g.cost += Number(m.unit_cost || 0); }
      if (m.status === 'FAILED') g.failed += 1;
      if (m.status === 'KHONG_GUI') g.skipped += 1;
    });
    var grouped = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) {
      return String(b.month).localeCompare(String(a.month)) || String(a.channel).localeCompare(String(b.channel));
    });
    function money(n, currency) { return Number(n || 0).toLocaleString('vi-VN') + (currency ? ' ' + currency : ''); }
    // Cộng dồn nhiều loại tiền thành một con số là một con số vô nghĩa.
    var currencies = rows.filter(function (m) { return m.status === 'SENT'; })
      .map(function (m) { return m.currency || 'VND'; })
      .filter(function (c, i, all) { return all.indexOf(c) === i; });
    var rate = rows.length ? Math.round(sent * 1000 / rows.length) / 10 : 0;
    return ui.strip([
      ui.metric('Lượt ghi nhận', rows.length),
      ui.metric('Đã gửi', sent, sent ? 'ok' : ''),
      ui.metric('Tỷ lệ thành công', rate + '%', rate < 80 && rows.length ? 'warn' : ''),
      ui.metric('Chi phí', currencies.length === 1 ? money(cost, currencies[0]) : money(cost, '') + ' (nhiều loại tiền)')
    ]) + ui.block({
      title: 'Chi phí và hiệu quả gửi tin', count: grouped.length, icon: 'chart',
      body: ui.table(
        [{ label: 'Kỳ', cls: 'fit' }, { label: 'Kênh', cls: 'fit' }, { label: 'Lượt ghi nhận', cls: 'num' },
          { label: 'Đã gửi', cls: 'num' }, { label: 'Lỗi', cls: 'num' }, { label: 'Không gửi', cls: 'num' }, { label: 'Chi phí', cls: 'num' }],
        grouped.map(function (g) { return { cells: [
          '<span class="tid">' + U.esc(g.month) + '</span>',
          U.esc(D.CHANNELS[g.channel] ? D.CHANNELS[g.channel].name : g.channel),
          '<span class="tid">' + g.queued + '</span>', '<span class="tid">' + g.sent + '</span>',
          '<span class="tid">' + g.failed + '</span>', '<span class="tid">' + g.skipped + '</span>',
          '<span class="tid">' + U.esc(money(g.cost, g.currency)) + '</span>'
        ] }; }),
        { icon: 'chart', title: 'Chưa có dữ liệu gửi', text: 'Số liệu xuất hiện sau khi có tin trong hàng đợi.' }
      )
    });
  }

  function runQueue() {
    if (U.isGas()) {
      LS.api.runOutbox().then(function (result) {
        return LS.app.refreshServer('Đã xử lý ' + result.sent + ' tin; lỗi ' + result.failed + '.');
      }).catch(function (error) { ui.toast(error.message || 'Không thể chạy hàng đợi.', 'err'); });
      return;
    }
    var n = 0;
    st().outbox.forEach(function (o) {
      if (o.status !== 'CHO_GUI') return;
      D.dispatch(o, st());
      n += 1;
    });
    if (!n) { ui.toast('Không có tin nào đang chờ gửi.', 'warn'); return; }
    logCfg('Hàng đợi gửi', 'Chạy hàng đợi, xử lý ' + n + ' tin.');
    U.save();
    LS.app.render();
    ui.toast('Đã xử lý ' + n + ' tin trong hàng đợi.');
  }

  function retry(id) {
    var o = U.byId(st().outbox, 'outbox_id', id);
    var ch = U.byId(st().channels, 'code', o.channel);
    if (o.retry >= ch.max_retry) { ui.toast('Đã vượt số lần gửi lại tối đa của kênh.', 'err'); return; }
    if (U.isGas()) {
      LS.api.changeOutbox(id, 'RETRY').then(function () { return LS.app.refreshServer('Đã đưa tin về hàng chờ gửi.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể gửi lại tin.', 'err'); });
      return;
    }
    o.status = 'CHO_GUI';
    o.note = '';
    U.save();
    LS.app.render();
    ui.toast('Đã đưa tin về hàng chờ gửi.');
  }

  function retryAll() {
    if (U.isGas()) {
      var ids = st().outbox.filter(function (o) {
        var ch = U.byId(st().channels, 'code', o.channel);
        return o.status === 'THAT_BAI' && ch && o.retry < ch.max_retry;
      }).map(function (o) { return o.outbox_id; });
      if (!ids.length) { ui.toast('Không tin nào còn lượt gửi lại.', 'warn'); return; }
      Promise.all(ids.map(function (id) { return LS.api.changeOutbox(id, 'RETRY'); }))
        .then(function () { return LS.app.refreshServer('Đã đưa ' + ids.length + ' tin về hàng chờ.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể gửi lại các tin lỗi.', 'err'); });
      return;
    }
    var n = 0;
    st().outbox.forEach(function (o) {
      if (o.status !== 'THAT_BAI') return;
      var ch = U.byId(st().channels, 'code', o.channel);
      if (o.retry >= ch.max_retry) return;
      o.status = 'CHO_GUI';
      o.note = '';
      n += 1;
    });
    logCfg('Hàng đợi gửi', 'Đưa ' + n + ' tin lỗi về hàng chờ.');
    U.save();
    LS.app.render();

    var targetId = id || U.uid('U');

  function parseImportText(text) {
    var lines = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (x) { return x.trim(); });
    if (!lines.length) return [];
    var delimiter = lines[0].indexOf('\t') !== -1 ? '\t' : (lines[0].indexOf(';') !== -1 ? ';' : ',');
    function cells(line) {
      var out = [], cur = '', quoted = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line.charAt(i);
        if (ch === '"' && line.charAt(i + 1) === '"' && quoted) { cur += '"'; i += 1; continue; }
        if (ch === '"') { quoted = !quoted; continue; }
        if (ch === delimiter && !quoted) { out.push(cur.trim()); cur = ''; } else cur += ch;
      }
      out.push(cur.trim()); return out;
    }
    var headers = cells(lines.shift()).map(function (x) {
      return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    });
    return lines.map(function (line) {
      var values = cells(line), row = {};
      headers.forEach(function (key, index) { row[key] = values[index] || ''; });
      return row;
    });
  }

  function importUsers(form) {
    var file = form.querySelector('input[type=file]').files[0];
    if (!file) { ui.toast('Chọn file CSV/TSV trước.', 'err'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var rows;
      try { rows = parseImportText(reader.result); } catch (e) { ui.toast('Không đọc được file nhập.', 'err'); return; }
      if (!rows.length) { ui.toast('File không có dòng dữ liệu.', 'err'); return; }
      if (!U.isGas()) {
        rows.forEach(function (r) {
          var code = String(r.login_code || r.ma_can_bo || '').trim();
          if (!code || !r.full_name || !r.unit_id) return;
          st().users.push({ user_id: r.user_id || U.uid('U'), login_code: code, auth_group: (r.role || 'PHONG_PGD') === 'PHONG_PGD' ? 'EXTERNAL' : 'INTERNAL', full_name: r.full_name, email: r.email || '', unit_id: r.unit_id, role: r.role || 'PHONG_PGD', active: r.is_active !== 'false' });
        });
        commit('Người dùng', 'Nhập danh sách cán bộ từ CSV.'); return;
      }
      LS.api.importUsers(rows).then(function (result) {
        ui.closeDialog(); return LS.app.refreshServer('Đã nhập ' + (result.created + result.updated) + ' cán bộ.');
      }).catch(function (error) { ui.toast(error.message || 'Không thể nhập danh sách cán bộ.', 'err'); });
    };
    reader.readAsText(file, 'UTF-8');
  }
