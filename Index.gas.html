      ui.field('Email', ui.input('customer.email', r.customer.email, { type: 'email' })) +
      '</div>' +
      '<div class="f-row request-priorities">' +
      ui.checkbox('priority_vip', priorityFlags(r.customer).indexOf('VIP') !== -1, 'Khách hàng VIP') +
      ui.checkbox('priority_urgent', priorityFlags(r.customer).indexOf('XU_LY_GAP') !== -1, 'Xử lý gấp') +
      '</div></div>' +
      '<div style="margin-top:1.125rem">' + ui.sectionTitle('Công việc') +
      '<div class="f-row">' +
      ui.field('Loại việc', ui.select('work_type_group', workTypeGroups(), (wtOf(i) && (wtOf(i).group || wtOf(i).name)) || '', { attrs: ' data-role="work-type-group" required' })) +
      ui.field('Sản phẩm', ui.select('work_type_code', productOptions((wtOf(i) && (wtOf(i).group || wtOf(i).name)) || '', i.work_type_code), i.work_type_code, { attrs: ' data-role="work-type-product" required' })) +
      ui.field('Ngày phát sinh', ui.input('occurrence_date', i.occurrence_date, { type: 'date', required: true })) +
      '</div></div>' +
      '<div style="margin-top:1.125rem">' +
      ui.field('Lý do sửa', ui.input('reason', '', { required: true, placeholder: 'Bổ sung số điện thoại, đổi loại việc…' })) +
      '</div>' +
      ui.formEnd(approval ? 'Gửi đề nghị sửa' : 'Lưu thay đổi') + '</form>',
      { size: 'md', sub: i.item_id });
  }

  function submitEdit(form) {
    var i = U.byId(st().items, 'item_id', form.getAttribute('data-id'));
    if (!i || !canEdit(i)) { ui.toast('Không có quyền sửa việc này.', 'err'); return; }
    var r = reqOf(i);
    var d = new FormData(form);
    var reason = String(d.get('reason')).trim();
    if (!U.validPhone(d.get('customer.phone')) || !U.validEmail(d.get('customer.email'))) { ui.toast('Kiểm tra số điện thoại và email khách hàng; giữ số 0 đầu.','err');return; }
    var changes = {};
    var selectedWt = U.byId(st().workTypes, 'code', String(d.get('work_type_code') || ''));
    if (!selectedWt || (selectedWt.group || selectedWt.name) !== String(d.get('work_type_group') || '')) {
      ui.toast('Sản phẩm không thuộc loại việc đã chọn.', 'err'); return;
    }

    ['work_type_code', 'occurrence_date'].forEach(function (k) {
      var v = String(d.get(k));
      if (v !== String(i[k])) changes[k] = v;
    });
    var selectedProduct = selectedWt ? selectedWt.name : '';
    // Chỉ đổi tên sản phẩm khi thật sự đổi loại việc. Tên lưu trên hồ sơ cũ có thể khác tên loại việc hiện tại
    // (đã đổi tên trong danh mục, hồ sơ chuyển kỳ): trước đây một lần chỉ đổi ngày cũng kéo theo "đổi sản phẩm".
    if (changes.work_type_code && selectedProduct !== String(i.product_name || '')) changes.product_name = selectedProduct;
    ['name', 'cif', 'phone', 'email'].forEach(function (k) {
      var v = String(d.get('customer.' + k) || '').trim();
      if (k==='phone') v=U.normalizePhone(v);
      if (k==='email') v=v.toLowerCase();
      if (v !== String(r.customer[k] || '')) changes['customer.' + k] = v;
    });
    var flags = ['VIP', 'XU_LY_GAP'].filter(function (x, idx) { return d.get(['priority_vip', 'priority_urgent'][idx]) !== null; });
    if (flags.slice().sort().join(',') !== priorityFlags(r.customer).slice().sort().join(',')) changes['customer.priority_flags'] = flags;

    if (!Object.keys(changes).length) { ui.toast('Không có thay đổi nào.', 'warn'); return; }

    if (U.isGas()) {
      // Cùng luật với bản cục bộ ở dưới: Phòng/PGD sửa việc đã giao thì chờ duyệt, còn lại áp dụng ngay.
      // Màn hình đổi trước, hộp thoại đóng, máy chủ nhận ở nền; bị từ chối thì hoàn tác và báo lý do.
      var needsApproval = editNeedsApproval(i, changes);
      if (needsApproval && i.pending) { ui.toast('Việc đang có một đề nghị sửa chờ kiểm soát duyệt.', 'err'); return; }
      var snap = snapshotItem(i), expectedVersion = Number(i.version), linkedSnaps = [];
      if (needsApproval) i.pending = { fields: changes, by: st().session, at: U.now(), reason: reason };
      else {
        if (changes.occurrence_date) linkedSnaps = moveLinkedDate(i, i.occurrence_date, changes.occurrence_date);
        applyChanges(i, changes); i.version = expectedVersion + 1;
      }
      ui.closeDialog(); LS.app.render();
      ui.toast(needsApproval ? 'Đã gửi đề nghị sửa cho kiểm soát.' : 'Đã lưu thay đổi.', 'ok');
      LS.app.background(LS.api.proposeRevision(snap.item.item_id, changes, reason, expectedVersion), {
        label: 'Sửa thông tin',
        onOk: function (result) { if (result) applyLinkedDateUpdates(result.linked_updates); },
        rollback: function () { restoreSnapshots(linkedSnaps); restoreItem(snap); }
      });
      return;
    }

    if (editNeedsApproval(i, changes)) {
      if (i.pending) { ui.toast('Việc đang có một đề nghị sửa chờ kiểm soát duyệt.', 'err'); return; }
      i.pending = { fields: changes, by: st().session, at: U.now(), reason: reason };
      logEvent(i.item_id, 'DE_NGHI_SUA', reason);
      D.queueNotifications(i, 'DE_NGHI_SUA', st(), st().session);
      ui.toast('Đã gửi đề nghị sửa cho kiểm soát.');
    } else {
      if (changes.occurrence_date) moveLinkedDate(i, i.occurrence_date, changes.occurrence_date);
      applyChanges(i, changes);
      i.version += 1;
      logEvent(i.item_id, 'SUA_THONG_TIN', reason + ' (' +
        Object.keys(changes).map(function (k) { return FIELD_LABEL[k] || k; }).join(', ') + ')');
      ui.toast('Đã lưu thay đổi.');
    }
    U.save();
    ui.closeDialog();
    LS.app.render();
  }

  /** Bản chụp việc và khách hàng trước khi đổi trên màn hình, để hoàn tác nếu máy chủ từ chối. */
  function snapshotItem(item) {
    var r = reqOf(item);
    return { item: JSON.parse(JSON.stringify(item)), customer: r ? JSON.parse(JSON.stringify(r.customer)) : null };
  }

  function restoreItem(snap) {
    var live = U.byId(st().items, 'item_id', snap.item.item_id);
    if (!live) return;
    Object.keys(snap.item).forEach(function (k) { live[k] = snap.item[k]; });
    var r = reqOf(live);
    if (r && snap.customer) r.customer = snap.customer;
  }

  function applyChanges(item, changes) {
    var r = reqOf(item);
    Object.keys(changes).forEach(function (k) {
      if (k.indexOf('customer.') === 0) r.customer[k.slice(9)] = changes[k];
      else item[k] = changes[k];
    });
    if (changes.work_type_code) {
      // Checklist thuộc loại việc: đổi loại thì làm lại checklist của loại mới (khớp applyRevision_).
      var wt = wtOf(item);
      item.checklist = (wt ? wt.checklist : []).map(function () { return false; });
      if (item.assigned_at) item.due_at = D.dueFrom(item.assigned_at, item.work_type_code, st());
    }
    if (r.customer.cif) r.customer.kind = 'DA_CO_CIF';
  }

  function revision(itemId, approve) {
    var i = U.byId(st().items, 'item_id', itemId);
    if (!i || !i.pending) return;
    if (['KS_LS', 'QUAN_LY_LS'].indexOf(me().role) === -1) { ui.toast('Chỉ kiểm soát được duyệt.', 'err'); return; }

    if (U.isGas()) {
      // Duyệt hủy đi bằng nút "Duyệt hủy"; ở đây chỉ duyệt hoặc từ chối đề nghị sửa, và từ chối đề nghị hủy.
      if (approve && (cancelPending(i) || !i.pending.fields)) { ui.toast('Duyệt đề nghị hủy bằng nút "Duyệt hủy".', 'err'); return; }
      if (approve && !(D.STATUS[i.status] && D.STATUS[i.status].open)) {
        ui.toast('Việc đã đóng từ lúc gửi đề nghị; chỉ có thể từ chối.', 'err'); return;
      }
      var snapRevision = snapshotItem(i);
      if (approve) { applyChanges(i, i.pending.fields); i.version = Number(i.version || 0) + 1; }
      i.pending = null;
      LS.app.render();
      ui.toast(approve ? 'Đã áp dụng thay đổi.' : 'Đã từ chối đề nghị.', 'ok');
      LS.app.background(LS.api.resolveRevision(itemId, approve, ''), {
        label: approve ? 'Duyệt đề nghị' : 'Từ chối đề nghị',
        rollback: function () { restoreItem(snapRevision); }
      });
      return;
    }

    if (approve && !(D.STATUS[i.status] && D.STATUS[i.status].open)) {
      ui.toast('Việc đã đóng từ lúc gửi đề nghị; chỉ có thể từ chối.', 'err'); return;
    }
    if (approve) {
      applyChanges(i, i.pending.fields);
      i.version += 1;
      logEvent(itemId, 'DUYET_SUA', 'Duyệt đề nghị của ' + userName(i.pending.by) + '.');
      ui.toast('Đã áp dụng thay đổi.');
    } else {
      logEvent(itemId, 'TU_CHOI_SUA', 'Từ chối đề nghị của ' + userName(i.pending.by) + '.');
      ui.toast('Đã từ chối đề nghị.');
    }
    i.pending = null;
    U.save();
    LS.app.render();
  }

  /* ============================ Hộp thoại: đăng ký việc mới ============================ */

  function catalogOptions(key, unitId) {
    var rows = (st().catalogOptions || []).filter(function (x) {
      return x.catalog_key === key && x.active && (!unitId || !x.unit_id || x.unit_id === unitId);
    }).sort(function (a, b) { return (a.sort_order || 9999) - (b.sort_order || 9999); });
    return rows;
  }

  function workTypeGroups() {
    var seen = {};
    return st().workTypes.filter(function (w) { return w.active; }).sort(function (a, b) {
      return (a.sort_order || 9999) - (b.sort_order || 9999);
    }).reduce(function (out, w) {
      var group = w.group || w.name;
      if (!seen[group]) { seen[group] = true; out.push([group, group]); }
      return out;
    }, []);
  }

  function productOptions(group, selectedCode) {
    return st().workTypes.filter(function (w) {
      return w.active && (!group || (w.group || w.name) === group);
    }).sort(function (a, b) {
      return (a.sort_order || 9999) - (b.sort_order || 9999);
    }).map(function (w) {
      var label = String(w.name || '').trim();
      var prefix = String(w.group || w.name || '').trim();
      if (prefix && label.slice(0, prefix.length).toLowerCase() === prefix.toLowerCase()) {
        var remainder = label.slice(prefix.length).replace(/^\s*[-–—:]\s*/, '').trim();
        if (remainder) label = remainder;
      }
      return [w.code, label];
    });
  }

  function defaultWorkTypeGroup() {
    var groups = workTypeGroups();
    return groups.length ? groups[0][0] : '';
  }

  // Chỉ nhóm công việc tín dụng có thể phát sinh lựa chọn TSBĐ. Nhóm TSĐB
  // bản thân đã là hồ sơ tài sản, không hỏi lại để tránh tạo nghĩa vụ kép.
  function canChooseCollateralMode(w) {
    return !!(w && w.active && ['Món', 'HM SXKD', 'Thấu chi', 'Thẻ tín dụng'].indexOf(w.group || '') !== -1);
  }

  function defaultCollateralMode(w) {
    if (!canChooseCollateralMode(w)) return 'NONE';
    return 'CO_SAN';
  }

  function collateralOptions(w) {
    if (!canChooseCollateralMode(w)) return [];
    return [
      ['CO_SAN', 'TSBĐ có sẵn — làm Hợp đồng tín dụng'],
      ['NONE', 'Không có TSBĐ — chỉ Hợp đồng tín dụng'],
      ['MOI', 'TSBĐ mới — tạo thêm hồ sơ tài sản']
    ];
  }

  function syncProductOptions(groupSelect, selectedCode) {
    var row = groupSelect && groupSelect.closest('.row-item');
    var product = row && row.querySelector('[data-role="work-type-product"]');
    if (!product) return;
    var options = productOptions(groupSelect.value, selectedCode);
    product.innerHTML = '<option value="">Chọn sản phẩm</option>' + options.map(function (op) {
      return '<option value="' + U.attr(op[0]) + '"' + (String(op[0]) === String(selectedCode || '') ? ' selected' : '') + '>' + U.esc(op[1]) + '</option>';
    }).join('');
    syncCollateralMode(product);
  }

  function syncCollateralMode(productSelect, selectedMode) {
    var row = productSelect && productSelect.closest('.row-item');
    var modeField = row && row.querySelector('[data-role="collateral-mode-field"]');
    var modeSelect = row && row.querySelector('[data-role="collateral-mode"]');
    if (!modeField || !modeSelect) { syncRequestQuantities(row); return; }
    var wt = U.byId(st().workTypes, 'code', productSelect.value);
    var options = collateralOptions(wt);
    modeSelect.innerHTML = options.map(function (op) {
      return '<option value="' + U.attr(op[0]) + '">' + U.esc(op[1]) + '</option>';
    }).join('');
    if (!options.length) {
      modeSelect.value = 'NONE';
      modeField.hidden = true;
      syncRequestQuantities(row);
      return;
    }
    modeField.hidden = false;
    modeSelect.value = selectedMode || defaultCollateralMode(wt);
    syncRequestQuantities(row);
  }

  function rowCollateralMode(row, wt) {
    if (!canChooseCollateralMode(wt)) return 'NONE';
    var field = row && row.querySelector('[data-role="collateral-mode-field"]');
    var select = row && row.querySelector('[data-role="collateral-mode"]');
    if (!field || field.hidden) return 'NONE';
    var mode = String(select && select.value || defaultCollateralMode(wt)).toUpperCase();
    return ['NONE', 'CO_SAN', 'MOI'].indexOf(mode) !== -1 ? mode : defaultCollateralMode(wt);
  }

  function syncRequestQuantities(row) {
    if (!row) return;
    var product = row.querySelector('[data-role="work-type-product"]');
    var wt = product && U.byId(st().workTypes, 'code', product.value);
    var item = { work_type_code: product && product.value || '', product_name: wt && wt.name || '', collateral_mode: rowCollateralMode(row, wt) };
    var keys = wt ? D.requestCollateralQuantityKeys(item, wt) : [];
    var fields = [
      { key: 'HD_THE_CHAP', role: 'request-quantity-mortgage' },
      { key: 'XUAT_KHO', role: 'request-quantity-export' }
    ];
    fields.forEach(function (field) {
      var wrap = row.querySelector('[data-role="' + field.role + '-field"]');
      var input = row.querySelector('[data-role="' + field.role + '"]');
      var visible = keys.indexOf(field.key) !== -1;
      if (wrap) wrap.hidden = !visible;
      if (input) {
        input.required = visible;
        if (!visible) input.value = '';
        else if (field.key === 'HD_THE_CHAP' && !input.value) input.value = '1';
      }
    });
    var container = row.querySelector('[data-role="request-quantity-fields"]');
    if (container) container.hidden = !keys.length;
    var details = row.querySelector('[data-role="request-details-line"]');
    if (details) details.hidden = !keys.length && !!(row.querySelector('[data-role="collateral-mode-field"]') || {}).hidden;
  }

  var requestWeekSequence = 0;

  function requestToday() {
    var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    var values = {};
    parts.forEach(function (p) { values[p.type] = p.value; });
    return values.year + '-' + values.month + '-' + values.day;
  }

  function requestWeekStart(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return '';
    var d = new Date(iso + 'T12:00:00Z');
    if (!isFinite(d.getTime()) || d.toISOString().slice(0, 10) !== iso) return '';
    d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
    return d.toISOString().slice(0, 10);
  }

  function requestWeekDate(monday, offset) {
    if (!requestWeekStart(monday) || offset < 0 || offset > 11) return '';
    var d = new Date(monday + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + Number(offset));
    return d.toISOString().slice(0, 10);
  }

  function requestWeekChoices(monday, selected, name, minDate) {
    var current = requestWeekStart(requestToday()), next = requestWeekDate(current, 7);
    var options = [[current, 'Tuần này'], [next, 'Tuần sau']];
    if (monday !== current && monday !== next) options.push([monday, 'Tuần ' + U.fmtDate(monday)]);
    return '<div class="request-week-head"><span>Chọn nhanh theo thứ</span>' +
      ui.select('week_' + name, options, monday, { attrs: ' data-role="request-week" aria-label="Tuần thực hiện"' }) + '</div>' +
      '<div class="request-week-options" role="group" aria-label="Ngày thực hiện từ Thứ 2 đến Thứ 6">' +
      [0, 1, 2, 3, 4].map(function (offset) {
        var date = requestWeekDate(monday, offset);
        return '<label class="request-week-choice"><input type="radio" name="' + name + '" value="' + date +
          '" data-role="request-weekday"' + (minDate && date < minDate ? ' disabled' : '') + (date === selected && (!minDate || date >= minDate) ? ' checked' : '') + '><span><b>Thứ ' + (offset + 2) +
          '</b><small>' + U.esc(U.fmtDate(date).slice(0, 5)) + '</small></span></label>';
      }).join('') + '</div>';
  }

  function requestNativeDate(row) {
    return row && row.querySelector('[data-request-native-date], [name^="dt_"]');
  }

  function syncRequestWeekdays(row, monday) {
    var box = row && row.querySelector('[data-request-weekdays]');
    var native = requestNativeDate(row);
    if (!box || !native) return;
    var select = box.querySelector('[data-role="request-week"]');
    monday = monday || requestWeekStart(native.value) || (select && select.value) || requestWeekStart(requestToday());
    box.innerHTML = requestWeekChoices(monday, native.value, box.getAttribute('data-request-weekdays'), box.getAttribute('data-min-date'));
  }

  function setRequestDate(row, value, monday) {
    var native = requestNativeDate(row);
    var display = row && row.querySelector('[data-date-display-for]');
    if (!native) return;
    native.value = value;
    if (display) {
      display.value = value ? U.fmtDate(value) : '';
      display.setCustomValidity('');
    }
    syncRequestWeekdays(row, monday);
  }

  function selectRequestWeekday(input) {
    if (!input.checked) return;
    var row = input.closest('.row-item'), value = input.value;
    setRequestDate(row, value);
    var selected = row && row.querySelector('[data-role="request-weekday"]:checked');
    if (selected && selected.focus) selected.focus();
  }

  function selectRequestWeek(select) {
    var row = select.closest('.row-item'), native = requestNativeDate(row);
    var old = native && requestWeekStart(native.value) ? new Date(native.value + 'T12:00:00Z').getUTCDay() : 0;
    setRequestDate(row, old >= 1 && old <= 5 ? requestWeekDate(select.value, old - 1) : '', select.value);
    var liveSelect = row.querySelector('[data-role="request-week"]');
    if (liveSelect && liveSelect.focus) liveSelect.focus();
  }

  function rowForm(idx) {
    var defaultGroup = defaultWorkTypeGroup();
    var weekName = 'request_weekday_' + (++requestWeekSequence);
    var today = requestToday();
    return '<div class="row-item">' +
      '<div class="request-row-head"><span>Nội dung việc</span>' +
      ui.iconBtn('trash', { act: 'del-row', label: 'Xóa dòng việc' }) + '</div>' +
      '<div class="request-main-fields">' +
      ui.field('Loại việc', ui.select('wg_' + idx, workTypeGroups(), defaultGroup, { attrs: ' data-role="work-type-group" required' })) +
      ui.field('Sản phẩm', ui.select('wt_' + idx, productOptions(defaultGroup), '', { blank: 'Chọn sản phẩm', attrs: ' data-role="work-type-product" required' })) +
      '</div>' +
      '<div class="request-details-line" data-role="request-details-line" hidden><div data-role="collateral-mode-field" hidden>' +
      ui.field('Tình trạng TSBĐ', ui.select('cm_' + idx, [], '', { attrs: ' data-role="collateral-mode"' })) +
      '</div>' +
      '<div data-role="request-quantity-fields" hidden><div class="f-row">' +
      '<div data-role="request-quantity-mortgage-field" hidden>' + ui.field('Số HĐ thế chấp cần soạn', ui.input('request_hd_the_chap_' + idx, '1', { type: 'number', attrs: ' min="1" step="1" data-role="request-quantity-mortgage"' })) + '</div>' +
      '<div data-role="request-quantity-export-field" hidden>' + ui.field('Số bìa tài sản cần xuất', ui.input('request_xuat_kho_' + idx, '', { type: 'number', attrs: ' min="1" step="1" data-role="request-quantity-export"' })) + '</div>' +
      '</div></div></div>' +
      '<div class="request-occurrence-date">' + ui.field('Ngày phát sinh', ui.input('dt_' + idx, today, { type: 'date', required: true })) + '</div>' +
      '<div class="request-weekdays" data-request-weekdays="' + weekName + '">' +
      requestWeekChoices(requestWeekStart(today), today, weekName) + '</div>' +
      '</div>';
  }

  function newRequest() {
    var u = me() || { full_name: '', unit_id: '' };
    // Kiểm soát LS đăng ký hộ phải chọn phòng gửi; phòng/PGD luôn là đơn vị của mình.
    var senderUnits = st().units.filter(function (x) { return x.active && x.kind === 'PGD'; })
      .sort(function (a, b) { return (a.sort_order || 9999) - (b.sort_order || 9999); })
      .map(function (x) { return [x.unit_id, x.name]; });
    var unitPicker = u.role === 'PHONG_PGD' ? '' :
      '<div class="f-row request-unit-picker" style="margin-bottom:1rem">' +
      ui.field('Phòng / PGD gửi hồ sơ', ui.select('unit_id', senderUnits, '', { blank: 'Chọn phòng / PGD', attrs: ' required' })) +
      '</div>';
    ui.openDialog('Đăng ký việc mới',
      '<form data-form="new-request" class="request-entry-form">' + unitPicker +
      ui.sectionTitle('Khách hàng') +
      '<div class="f-row customer-fields">' +
      ui.field('Tên khách hàng', ui.input('name', '', { required: true })) +
      ui.field('Mã CIF', ui.input('cif', '', { id: 'cifInput' })) +
      ui.field('Điện thoại', ui.input('phone', '', { type: 'tel', placeholder: '09xx xxx xxx' })) +
      ui.field('Email', ui.input('email', '', { type: 'email' })) +
      '</div>' +

      '<div class="request-priority-section">' + ui.sectionTitle('Mức ưu tiên') +
      '<div class="f-row request-priorities">' +
      ui.checkbox('priority_vip', false, 'Khách hàng VIP') +
      ui.checkbox('priority_urgent', false, 'Xử lý gấp') +
      '</div></div>' +

      '<div class="request-work-section">' + ui.sectionTitle('Danh sách việc') +
      '<div class="rows" id="rows">' + rowForm(0) + '</div>' +
      ui.btn('Thêm dòng việc', { act: 'add-row', icon: 'plus', sm: true, kind: 'line' }) +
      '</div>' +

      '<div class="request-note-section">' +

        var main=can?'<input type="number" inputmode="numeric" min="0" max="1000000" step="1" data-plan-user="'+U.attr(u.user_id)+'" data-plan-key="'+U.attr(k)+'" value="'+(goal===undefined || goal===null?'':U.attr(goal))+'"'+
          (tip?' title="'+U.attr(tip)+'"':'')+' aria-label="'+U.attr(d.label+' – '+u.full_name)+'">':'<b class="plan-value">'+number(row.targets[k])+'</b>';
        return '<td class="plan-cell'+(isBacklog(k)?' is-backlog':'')+'">'+main+'<div class="plan-meta">'+meta+'</div></td>';
      }).join('');
      return '<tr data-plan-staff-row><th scope="row"><span class="plan-name">'+U.esc(u.full_name)+'</span>'+
        (can?'<label class="plan-pin"><input type="checkbox" data-plan-pin value="'+U.attr(u.user_id)+'"'+(view.pins[u.user_id]?' checked':'')+'> Khóa</label>':'')+'</th>'+

    }).join('');
    var foot=leader()?'<tr class="plan-sum"><th scope="row" colspan="4">Tổng giao</th>'+keys.map(function(d){return '<td data-plan-sum="'+U.attr(d.key)+'">'+(isBacklog(d.key)?'':number(sumOf(d.key)))+'</td>';}).join('')+'</tr>'+
      (can?'<tr class="plan-total-row"><th scope="row" colspan="4"><span>Tổng phòng</span>'+ui.btn('Gợi ý',{data:' data-plan-act="suggest"',kind:'line',sm:true,title:'Chia tổng phòng theo năng suất, giữ nguyên dòng Khóa'})+'</th>'+keys.map(function(d){
        return '<td>'+(isBacklog(d.key)?'':'<input type="number" min="0" step="1" data-plan-total="'+U.attr(d.key)+'" value="'+U.attr(view.totals[d.key] || '')+'" aria-label="Tổng phòng – '+U.attr(d.label)+'">')+'</td>';
      }).join('')+'</tr>':''):'';
    var history=view.history.length?'<details class="plan-history"><summary>Lịch sử ('+view.history.length+')</summary>'+view.history.map(function(h){return '<p>v'+h.version+' · '+U.esc(h.action==='CLOSE'?'Chốt kỳ':'Giao kế hoạch')+' · '+U.esc(h.by)+' · '+U.esc(U.fmtDT(h.at))+'</p>';}).join('')+'</details>':'';
    var prev=P.previous(p);
    var html='<form data-form="staff-plan" class="plan-form"><div class="plan-bar"><div class="plan-pick">'+
      ui.field('Kỳ',ui.select('staff_plan_type',[['week','Tuần'],['month','Tháng'],['quarter','Quý']],p.type))+
      ui.field('Ngày trong kỳ',ui.input('staff_plan_date',p.start,{type:'date'}))+ui.btn('Xem kỳ',{data:' data-plan-act="load"',kind:'line'})+'</div>'+
      '<div class="plan-status"><b>'+U.esc(U.fmtDate(p.start)+' → '+U.fmtDate(p.end))+'</b><span>'+(plan?'v'+plan.version+' · '+(closed?'Đã chốt':'Đã giao'):'Chưa giao')+' · '+full+' ngày làm</span>'+
        '<span>Kỳ trước '+U.esc(U.fmtDate(prev.start)+' → '+U.fmtDate(prev.end))+'</span></div>'+
      '<div class="plan-actions">'+(can?ui.btn('Tải mẫu Excel',{data:' data-plan-act="template"',kind:'line',icon:'download'})+ui.btn('Nhập Excel',{data:' data-plan-act="import"',kind:'line',icon:'file'})+
        '<input type="file" hidden data-plan-file accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">'+
        ui.btn('Sao chép kỳ trước',{data:' data-plan-act="copy"',kind:'line'}):'')+
      (leader() && plan && !closed && p.end<c.today?ui.btn('Chốt kỳ',{data:' data-plan-act="close"',kind:'line',disabled:view.saving}):'')+
      (can?'<button type="submit" class="btn btn-primary" data-plan-save'+(view.saving?' disabled':'')+'>'+(view.saving?'Đang lưu…':'Giao kế hoạch')+'</button>':'')+'</div></div>'+
      (view.warning?ui.banner('warn','Cần kiểm tra',U.esc(view.warning)):'')+
      '<div class="plan-matrix-wrap"><table class="plan-matrix"><thead>'+head+'</thead><tbody>'+body+'</tbody>'+(foot?'<tfoot>'+foot+'</tfoot>':'')+'</table></div>'+history+'</form>';
    ui.openDialog(leader()?'Giao kế hoạch cán bộ':'Kế hoạch của tôi',html,{size:'xl plan-dialog'});
  }
  /** Mẫu Excel theo đúng kỳ đang mở: điền sẵn cán bộ và số đang giao, sửa xong nhập lại. */
  function template(){
    var p=view.period,keys=defs();
    var rows=[['Kỳ',p.key,U.fmtDate(p.start)+' → '+U.fmtDate(p.end)],['Mã CB','Họ tên'].concat(keys.map(function(d){return d.label+' ('+d.unit+')';}))];
    view.context.users.forEach(function(u){
      var l=lineOf(u.user_id) || {targets:{}};
      rows.push([u.user_id,u.full_name].concat(keys.map(function(d){var v=l.targets[d.key];return v===undefined || v===null?'':Number(v);})));
    });
    LS.app.downloadXlsx('mau_giao_ke_hoach_'+p.type+'_'+p.start,[{name:'Giao kế hoạch',rows:rows,headerRows:[1],autoFilter:false}]);
  }
  function norm(v){return String(v===undefined || v===null?'':v).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim();}
  /** Điền bảng từ file Excel; chưa lưu cho đến khi bấm Giao kế hoạch. */
  function fill(matrix){
    var h=-1,fileKey='';
    matrix.forEach(function(r,i){
      if(h!==-1)return;
      if(norm(r[0])==='ky')fileKey=String(r[1] || '').trim();
      if(r.some(function(x){return norm(x)==='ho ten';}))h=i;
    });
    if(h===-1)throw new Error('File không có dòng tiêu đề "Họ tên".');
    var header=matrix[h].map(norm),idCol=header.indexOf('ma cb'),nameCol=header.indexOf('ho ten'),cols={};
    defs().forEach(function(d){
      var names=[norm(d.label+' ('+d.unit+')'),norm(d.label),norm(d.key)];
      for(var i=0;i<header.length;i++)if(names.indexOf(header[i])!==-1){cols[d.key]=i;break;}
    });
    if(!Object.keys(cols).length)throw new Error('File không có cột chỉ tiêu nào.');
    var errors=[],missing=[],updates=[];
    matrix.slice(h+1).forEach(function(r,i){
      var id=idCol===-1?'':String(r[idCol] || '').trim(),name=String(r[nameCol] || '').trim();
      if(!id && !name)return;
      var target=id?lineOf(id):null;
      if(!target){var same=view.context.users.filter(function(u){return norm(u.full_name)===norm(name);});if(same.length===1)target=lineOf(same[0].user_id);}
      if(!target){missing.push(name || id);return;}
      var values={};
      Object.keys(cols).forEach(function(k){
        var v=r[cols[k]],n=Number(String(v).trim());
        if(v===undefined || v===null || String(v).trim()===''){values[k]=null;return;}
        if(!Number.isInteger(n) || n<0 || n>1000000)errors.push('dòng '+(h+i+2)+' ('+(name || id)+')');else values[k]=n;
      });
      updates.push([target,values]);
    });
    if(errors.length)throw new Error('Số chỉ tiêu không hợp lệ ở '+errors.slice(0,3).join(', ')+(errors.length>3?'…':'')+'.');
    if(!updates.length)throw new Error('File không có dòng cán bộ nào khớp.');
    updates.forEach(function(u){Object.keys(u[1]).forEach(function(k){if(u[1][k]===null)delete u[0].targets[k];else u[0].targets[k]=u[1][k];});});
    var notes=[];
    if(fileKey && fileKey!==view.period.key)notes.push('File mẫu của kỳ '+fileKey+', đang mở kỳ '+view.period.key+'.');
    if(missing.length)notes.push('Không khớp cán bộ: '+missing.join(', ')+'.');
    view.warning=notes.join(' ');draw();ui.toast('Đã điền '+updates.length+' cán bộ từ Excel.','ok');
  }
  function importFile(file){
    if(!file || !view || view.saving)return;remember();
    var read=file.arrayBuffer?file.arrayBuffer():new Promise(function(ok,fail){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=fail;r.readAsArrayBuffer(file);});
    Promise.all([LS.app.loadXlsx(),read]).then(function(res){
      var X=res[0],book=X.read(res[1],{type:'array'}),sheet=book.Sheets[book.SheetNames[0]];
      if(!sheet)throw new Error('File không có sheet dữ liệu.');
      fill(X.utils.sheet_to_json(sheet,{header:1,raw:true,defval:'',blankrows:false}));
    }).catch(function(e){ui.toast(e.message || 'Không đọc được file Excel.','err');});
  }
  /** Dán khối số chép từ Excel vào một ô: trải sang phải và xuống dưới như bảng tính. */
  function paste(input,text){
    var grid=String(text || '').replace(/\r/g,'').replace(/\n$/,'').split('\n').map(function(r){return r.split('\t');});
    if(grid.length<2 && grid[0].length<2)return false;
    var form=input.form,ids=[],keys=[];
    Array.prototype.forEach.call(form.querySelectorAll('[data-plan-user]'),function(x){
      var id=x.getAttribute('data-plan-user'),k=x.getAttribute('data-plan-key');
      if(ids.indexOf(id)===-1)ids.push(id);if(keys.indexOf(k)===-1)keys.push(k);
    });
    var r0=ids.indexOf(input.getAttribute('data-plan-user')),c0=keys.indexOf(input.getAttribute('data-plan-key'));
    grid.forEach(function(r,i){r.forEach(function(v,j){
      var id=ids[r0+i],k=keys[c0+j],cell=null,s=String(v).trim().replace(/[.,\s](?=\d{3}$)/g,'');
      if(id && k)Array.prototype.forEach.call(form.querySelectorAll('[data-plan-user]'),function(x){if(x.getAttribute('data-plan-user')===id && x.getAttribute('data-plan-key')===k)cell=x;});
      if(cell && (s==='' || /^\d+$/.test(s)))cell.value=s;
    });});
    keys.forEach(updateSum);return true;
  }
  function updateSum(key){
    remember();
    var cell=document.querySelector('[data-plan-sum="'+key+'"]');
    if(cell && !isBacklog(key))cell.textContent=number(sumOf(key));
  }
  function open(type,onDate){
    var u=me();if(!u || ['KS_LS','QUAN_LY_LS','ADMIN','CAN_BO_LS'].indexOf(u.role)===-1){ui.toast('Bạn không có quyền xem kế hoạch.','err');return Promise.resolve();}
    var p=P.period(type || 'week',onDate || U.localDate()),token=++request;
    ui.openDialog('Kế hoạch cán bộ','<p data-plan-loading>Đang lấy kế hoạch…</p>',{size:'xl plan-dialog'});
    var load=U.isGas()?LS.api.getWorkPlanning(p.type,p.start):Promise.resolve({context:localContext(),plans:state().staffPlans || [],history:(state().staffPlanHistory || []).filter(function(h){return h.plan_id===p.key;})});
    return load.then(function(data){
      if(token!==request || state().session!==u.user_id || !me() || me().role!==u.role || (U.isGas() && !document.querySelector('[data-plan-loading]')))return;
      var c=data.context;c.domain=D;c.types=state().workTypes;c.plans=data.plans;
      if(!leader()){
        c.users=c.users.filter(function(x){return x.user_id===u.user_id;});
        c.historicalUsers=(c.historicalUsers || []).filter(function(x){return x.user_id===u.user_id;});
        c.events=c.events.filter(function(x){return x.user_id===u.user_id;});
        c.outcomes=(c.outcomes || []).filter(function(x){return x.user_id===u.user_id;});c.intakes=(c.intakes || []).filter(function(x){return x.user_id===u.user_id;});
        data.plans=data.plans.map(function(q){var copy=Object.assign({},q,{lines:q.lines.filter(function(l){return l.user_id===u.user_id;})});
          if(q.snapshot)copy.snapshot=Object.assign({},q.snapshot,{rows:q.snapshot.rows.filter(function(r){return r.user_id===u.user_id;})});return copy;});
        c.plans=data.plans;
      }
      var plan=data.plans.filter(function(q){return q.key===p.key;})[0];
      var lines=c.users.map(function(x){var found=plan && plan.lines.filter(function(l){return l.user_id===x.user_id;})[0];return {user_id:x.user_id,targets:found?Object.assign({},found.targets):{}};});
      view={period:p,context:c,plans:data.plans,history:data.history,lines:lines,pins:{},totals:{},warning:'',saving:false};draw();
    }).catch(function(e){ui.toast(e.message,'err');ui.openDialog('Kế hoạch cán bộ','<p>'+U.esc(e.message)+'</p>',{size:'lg'});});
  }
  function applyPlan(plan,action){
    if(LS.screens)LS.screens.setFilter('board','plan','1');
    state().staffPlans=(state().staffPlans || []).filter(function(q){return q.key!==plan.key;}).concat([plan]);
    view.plans=view.plans.filter(function(q){return q.key!==plan.key;}).concat([plan]);view.context.plans=view.plans;
    var h={plan_id:plan.plan_id,version:plan.version,by:state().session,at:new Date().toISOString(),action:action};view.history.push(h);
    if(!U.isGas()){(state().staffPlanHistory || (state().staffPlanHistory=[])).push(Object.assign({},h,{plan_json:JSON.stringify(plan)}));U.save();}
    view.saving=false;draw();if(LS.app)LS.app.render();ui.toast(action==='CLOSE'?'Đã chốt kỳ.':'Đã giao kế hoạch.','ok');
  }
  function publish(){
    if(!leader() || !view || view.saving)return;remember();
    try {
      view.lines.forEach(function(l){Object.keys(l.targets).forEach(function(k){if(!Number.isInteger(l.targets[k]) || l.targets[k]<0 || l.targets[k]>1000000)throw new Error('Chỉ tiêu phải là số nguyên không âm.');});});
      var plan=currentPlan(),issues=P.hierarchyIssues(view.plans.filter(function(q){return q.key!==view.period.key;}).concat([Object.assign({},view.period,{lines:view.lines})]),view.context.calendar);
      if(issues.length)throw new Error(issues[0]);
      view.saving=true;draw();
      var payload={type:view.period.type,date:view.period.start,expected_version:plan?plan.version:0,lines:view.lines};
      var run=U.isGas()?LS.api.saveStaffPlan(payload):Promise.resolve(Object.assign({},view.period,{plan_id:view.period.key,status:'PUBLISHED',version:payload.expected_version+1,lines:JSON.parse(JSON.stringify(view.lines)),assigned_by:state().session,assigned_at:new Date().toISOString()}));
      run.then(function(result){applyPlan(result,'PUBLISH');}).catch(function(e){view.saving=false;view.warning=e.message;draw();ui.toast(e.message,'err');});
    }catch(e){ui.toast(e.message,'err');}
  }
  function action(name){
    if(!view || view.saving)return;remember();var form=document.querySelector('[data-form="staff-plan"]');
    if(name==='load'){open(form.elements.staff_plan_type.value,form.elements.staff_plan_date.value);return;}
    if(!leader())return;
    try {
      if(name==='suggest') {
        var keys=defs().map(function(d){return d.key;}).filter(function(k){return !isBacklog(k) && String(view.totals[k] || '')!=='';}),notes=[];
        if(!keys.length)throw new Error('Nhập tổng phòng cho ít nhất một chỉ tiêu.');
        keys.forEach(function(k){
          var pins={};view.lines.forEach(function(l){if(view.pins[l.user_id])pins[l.user_id]=l.targets[k] || 0;});
          var s=P.suggest(view.context,view.period,k,Number(view.totals[k]),pins);
          view.lines.forEach(function(l){l.targets[k]=s.values[l.user_id];});
          if(s.warning)notes.push(defs().filter(function(d){return d.key===k;})[0].label+': '+s.warning);
        });
        view.warning=notes.join(' ');draw();
      } else if(name==='copy') {
        var prior=P.previous(view.period),ev=P.evaluate(view.context,prior,view.plans);
        view.lines.forEach(function(l){
          if(view.pins[l.user_id])return;
          var r=ev.rows.filter(function(x){return x.user_id===l.user_id;})[0],u=U.byId(view.context.users,'user_id',l.user_id);
          if(r)P.KEYS.forEach(function(k){var n=r.targets[k];
            if(n!==null && n!==undefined)l.targets[k]=isBacklog(k)?n:Math.round(n*P.workDays(view.period,view.context.calendar,u)/Math.max(1,P.workDays(prior,view.context.calendar,u)));});
        });draw();
      } else if(name==='template') template();
      else if(name==='import') {var input=form.querySelector('[data-plan-file]');if(input){input.value='';input.click();}}
      else if(name==='close') {
        var plan=currentPlan();if(!plan || plan.status==='CLOSED')return;view.saving=true;draw();
        var closed=Object.assign({},plan,{status:'CLOSED',version:plan.version+1,snapshot:P.evaluate(view.context,view.period,view.plans)});
        var run=U.isGas()?LS.api.closeStaffPlan(plan.plan_id,plan.version):Promise.resolve(closed);
        run.then(function(result){applyPlan(result,'CLOSE');}).catch(function(e){view.saving=false;view.warning=e.message;draw();});
      }
    }catch(e){ui.toast(e.message,'err');}
  }
  function summary(userId){
    var plans=state().staffPlans || [],p=P.period('week',U.localDate());
    if(!plans.some(function(q){return q.key===p.key;}))p=P.period('month',U.localDate());
    if(!plans.some(function(q){return q.key===p.key;}))p=P.period('quarter',U.localDate());
    var c=localContext(),ev=P.evaluate(c,p,plans),row=ev.rows.filter(function(r){return r.user_id===userId;})[0];
    if(!row)return '';
    var entries=defs().filter(function(d){return row.targets[d.key]!==null;}).map(function(d){var actual=d.key.indexOf('TON_')===0?(row.backlog?row.backlog[d.key] || 0:null):row.actual[d.key] || 0;
      return '<div><span>'+U.esc(d.label)+'</span><b>'+number(actual)+' / '+number(row.targets[d.key])+'</b><small>'+U.esc(d.unit)+'</small></div>';}).join('');
    return ui.block({title:'Kế hoạch của tôi',icon:'clipboard',actions:ui.btn('Xem kế hoạch',{data:' data-plan-act="open"',kind:'line',sm:true}),body:ui.pad(entries?'<p class="t2">'+U.esc(U.fmtDate(p.start)+' → '+U.fmtDate(p.end))+'</p><div class="plan-personal">'+entries+'</div>':'<p class="t2">Chưa giao kế hoạch cá nhân trong kỳ.</p>')});
  }
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-plan-act]');if(!el)return;e.preventDefault();var name=el.getAttribute('data-plan-act');if(name==='open')open();else action(name);
  });
  document.addEventListener('submit',function(e){if(e.target.getAttribute('data-form')==='staff-plan'){e.preventDefault();publish();}});
  document.addEventListener('input',function(e){var key=e.target.getAttribute && e.target.getAttribute('data-plan-key');if(key && view)updateSum(key);});
  document.addEventListener('change',function(e){if(e.target.hasAttribute && e.target.hasAttribute('data-plan-file'))importFile(e.target.files[0]);});
  document.addEventListener('paste',function(e){
    var t=e.target;if(!view || !t.hasAttribute || !t.hasAttribute('data-plan-user'))return;
    if(paste(t,(e.clipboardData || window.clipboardData).getData('text')))e.preventDefault();
  });
  // Enter trong ô chỉ tiêu xuống dòng dưới cùng cột, không gửi form như bảng tính.
  document.addEventListener('keydown',function(e){
    var t=e.target;if(e.key!=='Enter' || !view || !t.hasAttribute || (!t.hasAttribute('data-plan-user') && !t.hasAttribute('data-plan-total')))return;

    var next=col[col.indexOf(t)+(e.shiftKey?-1:1)];if(next){next.focus();next.select();}
  });
  return {open:open,summary:summary};
})();

  var SCORE_HIDE_KEY = 'ls_admin_hide_scorecard';

      ['templates', 'Mẫu tin', 'file'],

    ]],
    ['Danh mục', [
      ['types', 'Loại việc', 'tag'],
      ['units', 'Đơn vị', 'building'],
      ['users', 'Người dùng', 'users'],
      ['reasons', 'Lý do', 'clipboard'],
      ['catalog', 'Danh mục chọn', 'tag'],
      ['assignment', 'Phân công nhanh', 'zap']
    ]],

  // Nhật ký cấu hình chỉ tải khi mở mục này, không đi theo mỗi lượt tải lại của ứng dụng.
  var cfgLogCache = null, cfgLogSequence = 0;
  function setSection(s) { section = s; cfgLogCache = null; cfgLogSequence++; }

  function loadConfigLog() {
    var seq = ++cfgLogSequence;
    cfgLogCache = { loading: true };
    LS.api.getConfigLog().then(function (data) {
      if (seq !== cfgLogSequence) return;
      cfgLogCache = { rows: data.rows || [] };
      LS.app.render();
    }).catch(function (e) {
      if (seq !== cfgLogSequence) return;
      cfgLogCache = { error: e.message || 'Không tải được nhật ký cấu hình.' };
      LS.app.render();
    });

  function nav() {
    var h = D.outboxHealth(st());
    var alerts = {
      outbox: h.failed + h.waiting + h.unknown,
      channels: st().channels.filter(function (c) { return D.CHANNELS[c.code] && !D.channelUsable(c.code, st()); }).length,
      templates: st().templates.filter(function (t) { return t.status === 'CHO_DUYET'; }).length
    };

    return '<nav class="admin-nav">' + NAV.map(function (grp) {
      return '<div class="grp">' + U.esc(grp[0]) + '</div>' + grp[1].map(function (it) {

          (section === it[0] ? ' aria-current="page"' : '') + '>' +
          U.icon(it[2], 16) + U.esc(it[1]) +
          (alerts[it[0]] ? '<span class="pill">' + alerts[it[0]] + '</span>' : '') + '</button>';
      }).join('');

  function view() {
    var body;
    switch (section) {
      case 'channels': body = channels(); break;
      case 'templates': body = templates(); break;
      case 'rules': body = rules(); break;
      case 'outbox': body = outbox(); break;
      case 'metrics': body = metrics(); break;
      case 'types': body = types(); break;
      case 'units': body = units(); break;
      case 'users': body = users(); break;
      case 'reasons': body = reasons(); break;
      case 'catalog': body = catalog(); break;
      case 'assignment': body = assignment(); break;
      case 'calendar': body = calendar(); break;
      case 'settings': body = settings(); break;
      case 'update-notice': body = updateNotice(); break;
      case 'data': body = data(); break;
      case 'cfglog': body = cfglog(); break;
      default: body = overview();
    }
    return '<div class="admin">' + nav() + '<div class="admin-body">' + body + '</div></div>';
  }

  /* ============================ Tổng quan ============================ */

  function overview() {
    var s = st();
    var h = D.outboxHealth(s);
    var notReady = s.channels.filter(function (c) { return !D.channelUsable(c.code, s); });
    var openItems = s.items.filter(function (i) { return D.STATUS[i.status].open; });
    var late = openItems.filter(function (i) { var x = D.sla(i, s); return x && x.late; });
    var email = U.byId(s.channels, 'code', 'EMAIL') || { config: {} };
    var emailQuota = Number(email.config.daily_quota || 0);
    var quotaLeft = emailQuota - D.emailUsedToday(email.config);
    var pendingTpl = s.templates.filter(function (t) { return t.status === 'CHO_DUYET'; });
    var plan = s.activePlan || {};
    var month = D.monthKey(new Date());
    var scores = s.operationalScorecard && s.operationalScorecard.length
      ? s.operationalScorecard
      : D.operationalScorecard(plan.start_date || (month + '-01'), plan.end_date || (month + '-31'), s);
    function finiteScore(value) {
      var score = Number(value);
      return isFinite(score) ? score : null;
    }
    var scored = scores.filter(function (x) { return finiteScore(x.score) !== null; });

    var out = '';

    if (s.settings.env === 'THU_NGHIEM') {
      out += ui.banner('warn', 'Hệ thống đang ở môi trường thử nghiệm',
        'THU_NGHIEM');
    }

    out += ui.strip([
      ui.metric('Tin chờ gửi', h.backlog, h.backlog > s.settings.backlog_alert ? 'danger' : ''),
      ui.metric('Tin thất bại', h.failed, h.failed ? 'danger' : ''),
      ui.metric('Chờ cán bộ xác nhận', h.waiting, h.waiting ? 'warn' : ''),
      ui.metric('Không gửi được', h.skipped, h.skipped ? 'warn' : ''),
      ui.metric('Việc quá hạn', late.length, late.length ? 'danger' : '')
    ]);

    out += scoreHidden ? scoreHiddenBlock(scores.length, (s.operationalScoreSnapshots || []).length) : scoreBlocks(s, scores, finiteScore);
    return out + overviewRest(s, h, notReady, emailQuota, quotaLeft, pendingTpl);
  }

  function scoreHiddenBlock(liveCount, snapshotCount) {
    return ui.block({
      title: 'Điểm vận hành đang ẩn', icon: 'eye-off',
      actions: ui.btn('Hiện điểm vận hành', { act: 'admin-score-toggle', data: ' data-hide="0"', sm: true, kind: 'primary', icon: 'eye' }),
      body: ui.pad('<p class="t2">' + liveCount + ' cán bộ · ' + snapshotCount + ' bản chốt</p>')
    });
  }

  function scoreBlocks(s, scores, finiteScore) {
    var out = '';
    out += ui.block({
      title: 'Điểm vận hành', count: scores.length, icon: 'chart',
      actions: ui.btn('Tạm ẩn điểm', { act: 'admin-score-toggle', data: ' data-hide="1"', sm: true, icon: 'eye-off',
        title: 'Ẩn bảng điểm và lịch sử điểm khỏi Tổng quan' }),
      body: ui.table(
        [{ label: 'Cán bộ' }, { label: 'Đúng hạn', cls: 'num' }, { label: 'Hoàn thành', cls: 'num' }, { label: 'Tồn quá hạn', cls: 'num' }, { label: 'Điểm', cls: 'num' }],
        scores.map(function (x) {
          var score = finiteScore(x.score);
          var tone = score === null ? '' : (score >= 80 ? 'ok' : (score >= 60 ? 'warn' : 'danger'));
          return { cls: x.lateOpen ? 'flag-warn' : '', cells: [
            '<div class="t1">' + U.esc(x.user.full_name) + '</div>',
            x.timedDone ? '<span class="tid">' + x.onTime + '/' + x.timedDone + '</span>'
              : (x.slaExemptDone ? ui.tag('Miễn HĐTC', 'neutral') : '<span class="t2">—</span>'),
            '<span class="tid">' + x.done + '/' + x.eligible + '</span>',
            x.lateOpen ? ui.tag(String(x.lateOpen), 'danger') : '<span class="tid">0</span>',
            score === null ? (x.dataQuality === 'SLA_MIEN' ? ui.tag('Không tính SLA', 'neutral') : '<span class="t2">Chưa có dữ liệu</span>') : ui.tag(String(score), tone)
          ] };
        }),
        { icon: 'users', title: 'Chưa có cán bộ LS', text: '' }
      )
    });

    var snapshots = (s.operationalScoreSnapshots || []).slice().sort(function (a, b) {
      return String(b.month_key || '').localeCompare(String(a.month_key || '')) ||
        String(b.captured_at || '').localeCompare(String(a.captured_at || '')) ||
        String(a.full_name || '').localeCompare(String(b.full_name || ''));
    });
    out += ui.block({
      title: 'Lịch sử điểm đã chốt', count: snapshots.length, icon: 'history',
      body: ui.table(
        [{ label: 'Kỳ', cls: 'fit' }, { label: 'Cán bộ' }, { label: 'Điểm', cls: 'num' },
          { label: 'Hoàn thành / đúng hạn', cls: 'fit' }, { label: 'Chất lượng dữ liệu' }, { label: 'Chốt lúc', cls: 'fit' }],
        snapshots.slice(0, 120).map(function (x) {
          var score = x.score === '' || x.score === null || x.score === undefined ? '—' : String(x.score);
          var tone = score === '—' ? '' : (Number(x.score) >= 80 ? 'ok' : (Number(x.score) >= 60 ? 'warn' : 'danger'));
          return { cells: [
            '<span class="tid">' + U.esc(x.month_key || '—') + '</span>',
            '<div class="t1">' + U.esc(x.full_name || x.user_id || '—') + '</div>',
            score === '—' ? '<span class="t2">—</span>' : ui.tag(score, tone),
            '<span class="tid">' + U.esc(String(x.done || 0)) + ' / ' + U.esc(String(x.on_time || 0)) + '</span>',
            '<span class="t2">' + U.esc(x.data_quality === 'SLA_MIEN' ? 'Miễn quá hạn (HĐTC)' : (x.data_quality === 'THIEU_HAN_SLA' ? 'Thiếu hạn SLA' : (x.data_quality === 'OK' ? 'Đạt dữ liệu' : (x.data_quality || 'Đạt dữ liệu')))) + '</span>',
            '<span class="tid">' + U.fmtDT(x.captured_at || '') + '</span>'
          ] };
        }),
        { icon: 'chart', title: 'Chưa có kỳ đã chốt', text: '' }
      )
    });
    return out;
  }

  function overviewRest(s, h, notReady, emailQuota, quotaLeft, pendingTpl) {
    var out = '';
    var workerAt = String(s.settings.worker_last_run_at || '').trim();
    var workerStatus = String(s.settings.worker_last_run_status || '').trim();
    var workerTone = workerStatus === 'OK' ? 'ok' : (workerStatus ? 'warn' : '');
    out += ui.block({
      title: 'Tiến trình gửi tin', icon: 'activity',
      body: ui.pad(workerAt
        ? ui.kv([
          ['Trạng thái lần chạy gần nhất', ui.tag(workerStatus || 'CHƯA CÓ', workerTone)],
          ['Thời điểm', U.fmtDT(workerAt)],
          ['Đã gửi / lỗi / còn lại', String(s.settings.worker_last_run_sent || 0) + ' / ' + String(s.settings.worker_last_run_failed || 0) + ' / ' + String(s.settings.worker_last_run_remaining || 0)],
          ['Backup kho gần nhất', s.settings.backup_last_at ? U.fmtDT(s.settings.backup_last_at) : 'Chưa có']
        ])
        : ui.banner('warn', 'Chưa ghi nhận lần chạy', ''))
    });

    out += ui.block({
      title: 'Tình trạng kênh gửi tin', icon: 'zap',
      actions: ui.btn('Mở cấu hình kênh', { act: 'admin-go', data: ' data-section="channels"', sm: true, icon: 'right' }),
      body: ui.table(
        [{ label: 'Kênh' }, { label: 'Trạng thái', cls: 'fit' }, { label: 'Điều kiện còn thiếu' }],
        s.channels.filter(function (c) { return D.CHANNELS[c.code]; }).map(function (c) {
          var def = D.CHANNELS[c.code];
          var rd = D.channelReady(c.code, s);
          var miss = rd.checks.filter(function (x) { return !x.ok; });
          return {
            cls: miss.length ? 'flag-warn' : '',
            cells: [
              '<div class="t1">' + U.esc(def.name) + '</div>',
              ui.tag(D.CHANNEL_STATUS[c.status].label, D.CHANNEL_STATUS[c.status].tone),
              miss.length
                ? '<div class="t2">' + miss.map(function (x) { return U.esc(x.label); }).join('<br>') + '</div>'
                : ui.tag('Đủ điều kiện', 'ok')
            ]
          };
        })
      )
    });

    var warnings = [];
    if (h.failed) warnings.push([h.failed + ' tin thất bại chưa xử lý', '']);
    if (h.backlog > s.settings.backlog_alert) warnings.push(['Hàng đợi vượt ngưỡng cảnh báo', '']);
    if (pendingTpl.length) warnings.push([pendingTpl.length + ' mẫu tin chờ duyệt', '']);
    if (emailQuota > 0 && quotaLeft <= 10) warnings.push(['Sắp hết hạn mức thư trong ngày', '']);
    if (notReady.length) warnings.push([notReady.length + ' kênh chưa sẵn sàng', '']);

    out += ui.block({
      title: 'Cảnh báo vận hành', count: warnings.length, icon: 'warn',
      body: warnings.length
        ? ui.pad('<div class="f-stack">' + warnings.map(function (w) {
          return ui.banner('warn', w[0], w[1]);
        }).join('') + '</div>')
        : ui.empty({ icon: 'check', title: 'Không có cảnh báo', text: '' })
    });

    return out;
  }

  /* ============================ Kênh gửi tin ============================ */

  function channels() {
    var s = st();
    return '<div class="chan-list">' + s.channels.filter(function (c) { return D.CHANNELS[c.code] && D.CHANNEL_STATUS[c.status]; }).map(function (c) {
        var def = D.CHANNELS[c.code];
        var rd = D.channelReady(c.code, s);
        var usable = D.channelUsable(c.code, s);

        return '<div class="chan' + (usable ? '' : ' off') + '">' +
          '<div class="chan-top">' +
          '<div class="chan-ico">' + U.icon(def.icon, 18) + '</div>' +
          '<div style="min-width:0;flex:1">' +
          '<div class="chan-name">' + U.esc(def.name) + '</div>' +
          '<div class="chan-meta">' + U.esc(def.desc) + '</div>' +
          '</div>' +
          ui.tag(D.CHANNEL_STATUS[c.status].label, D.CHANNEL_STATUS[c.status].tone) +
          '</div>' +

          '<div class="chan-checks">' + rd.checks.map(function (x) {
            return '<div class="chan-check ' + (x.ok ? 'done' : 'miss') + '">' +
              U.icon(x.ok ? 'check' : 'warn', 14) +
              '<span>' + U.esc(x.label) + (x.hint ? ' — ' + U.esc(x.hint) : '') + '</span></div>';
          }).join('') +
          (c.test_mode && !def.locked
            ? '<div class="chan-check"><span>' + U.icon('lock', 14) + ' Chế độ thử nghiệm: ' +
            (c.allowlist.length ? c.allowlist.length + ' người nhận được phép' : 'chưa ai trong danh sách cho phép') + '</span></div>'
            : '') +
          '</div>' +

          '<div class="chan-foot">' +
          (def.locked
            ? '<span class="t2">Kênh mặc định, luôn bật</span>'
            : ui.switchBox('on_' + c.code, c.status === 'HOAT_DONG' || c.status === 'THU_NGHIEM',
              c.status === 'TAM_NGUNG' ? 'Đang tạm ngưng' : 'Cho phép gửi',
              { disabled: !rd.ok, attrs: ' data-act="chan-toggle" data-code="' + U.attr(c.code) + '"' })) +
          '<div class="btn-row" style="margin-left:auto">' +
          (def.locked ? '' : ui.btn('Cấu hình', { act: 'chan-edit', data: ' data-code="' + U.attr(c.code) + '"', sm: true, icon: 'sliders' })) +
          (usable && !def.locked ? ui.btn('Gửi thử', { act: 'chan-test', data: ' data-code="' + U.attr(c.code) + '"', sm: true, icon: 'send' }) : '') +
          '</div></div></div>';

  function condAttrs(field) {
    if (!field.when) return '';
    var k = Object.keys(field.when)[0];
    return ' data-when="' + k + '=' + field.when[k] + '"';
  }

  function channelDialog(code) {
    var c = U.byId(st().channels, 'code', code);
    var def = D.CHANNELS[code];
    if (!c || !def) return;

    var fields = def.fields.map(function (fd) {
      var val = c.config[fd.key];
      var ctrl;
      if (fd.type === 'select') ctrl = ui.select('cfg.' + fd.key, fd.options, val, { attrs: ' data-cond="' + fd.key + '"' });
      else if (fd.type === 'bool') ctrl = ui.switchBox('cfg.' + fd.key, !!val, 'Đã hoàn tất');
      else if (fd.type === 'number') ctrl = ui.input('cfg.' + fd.key, val, { type: 'number', min: 0, disabled: fd.readonly });
      else ctrl = ui.input('cfg.' + fd.key, val, { placeholder: fd.placeholder, disabled: fd.readonly });
      return '<div' + condAttrs(fd) + '>' + ui.field(fd.label, ctrl, fd.hint) + '</div>';
    }).join('');

    ui.openDialog('Cấu hình ' + def.name,
      '<form data-form="channel" data-code="' + U.attr(code) + '">' +
      '<div>' + ui.sectionTitle('Kết nối') +
      '<div class="f-row">' + fields + '</div></div>' +

      '<div style="margin-top:1.125rem">' + ui.sectionTitle('An toàn khi gửi') +
      '<div class="f-stack">' +
      ui.checkbox('test_mode', c.test_mode, 'Chế độ thử nghiệm',
        'chỉ gửi cho người nhận trong danh sách dưới đây') +
      ui.field('Danh sách người nhận được phép',
        ui.textarea('allowlist', c.allowlist.join('\n'), { placeholder: 'mỗi dòng một email hoặc số điện thoại' }),
        'bỏ trống khi đã tắt chế độ thử nghiệm') +
      '<div class="f-row">' +
      ui.field('Giới hạn tin mỗi giờ', ui.input('rate_per_hour', c.rate_per_hour, { type: 'number', min: 0 })) +
      ui.field('Số lần gửi lại tối đa', ui.input('max_retry', c.max_retry, { type: 'number', min: 0, max: 10 })) +
      '</div></div></div>' +

      ui.formEnd('Lưu cấu hình') + '</form>',
      { size: 'md', sub: code });

    LS.app.applyConds();
  }

  function saveChannel(form) {
    var code = form.getAttribute('data-code');
    var c = U.byId(st().channels, 'code', code);
    var def = D.CHANNELS[code];
    var d = new FormData(form);

    def.fields.forEach(function (fd) {
      if (fd.readonly) return;
      var raw = d.get('cfg.' + fd.key);
      if (fd.type === 'bool') c.config[fd.key] = raw !== null;
      else if (fd.type === 'number') c.config[fd.key] = Number(raw || 0);
      else c.config[fd.key] = String(raw || '').trim();
    });

    c.test_mode = d.get('test_mode') !== null;
    c.allowlist = String(d.get('allowlist') || '').split('\n')
      .map(function (x) { return x.trim(); }).filter(Boolean);
    c.rate_per_hour = Number(d.get('rate_per_hour') || 0);
    c.max_retry = Number(d.get('max_retry') || 0);

    // Thiếu điều kiện thì tự hạ về chưa kích hoạt, không để trạng thái nói dối.
    var rd = D.channelReady(code, st());
    if (!rd.ok && c.status !== 'CHUA_KICH_HOAT') c.status = 'CHUA_KICH_HOAT';
    else if (rd.ok && c.status === 'CHUA_KICH_HOAT') c.status = c.test_mode ? 'THU_NGHIEM' : 'HOAT_DONG';
    else if (rd.ok && c.status !== 'TAM_NGUNG') c.status = c.test_mode ? 'THU_NGHIEM' : 'HOAT_DONG';

    if (U.isGas()) {
      LS.api.saveDelivery('channel', code, {
        status: c.status, test_mode: c.test_mode, allowlist: c.allowlist.join(','), rate_per_hour: c.rate_per_hour,
        max_retry: c.max_retry, config_json: JSON.stringify(c.config), updated_at: U.now()
      }).then(function () { ui.closeDialog(); return LS.app.refreshServer('Đã lưu cấu hình kênh.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể lưu cấu hình kênh.', 'err'); });
      return;
    }

    commit('Kênh gửi tin', 'Cập nhật cấu hình ' + def.name + ', trạng thái ' + c.status + '.');
  }

  function toggleChannel(code) {
    var c = U.byId(st().channels, 'code', code);
    var rd = D.channelReady(code, st());
    if (!rd.ok) { ui.toast('Kênh chưa đủ điều kiện để bật.', 'err'); LS.app.render(); return; }

    if (c.status === 'TAM_NGUNG' || c.status === 'CHUA_KICH_HOAT') c.status = c.test_mode ? 'THU_NGHIEM' : 'HOAT_DONG';
    else c.status = 'TAM_NGUNG';

    if (U.isGas()) {
      LS.api.saveDelivery('channel', code, {
        status: c.status, test_mode: c.test_mode, allowlist: c.allowlist.join(','), rate_per_hour: c.rate_per_hour,
        max_retry: c.max_retry, config_json: JSON.stringify(c.config), updated_at: U.now()
      }).then(function () { return LS.app.refreshServer(D.CHANNELS[code].name + ': ' + D.CHANNEL_STATUS[c.status].label); })
        .catch(function (error) { ui.toast(error.message || 'Không thể đổi trạng thái kênh.', 'err'); });
      return;
    }

    logCfg('Kênh gửi tin', D.CHANNELS[code].name + ' chuyển sang ' + c.status + '.');
    U.save();
    LS.app.render();
    ui.toast(D.CHANNELS[code].name + ': ' + D.CHANNEL_STATUS[c.status].label);
  }

  /** Cấu hình xong mà không kiểm chứng được thì "đã bật" mới chỉ là một cái công tắc. */
  function testChannel(code) {
    var c = U.byId(st().channels, 'code', code);
    var u = me();
    var addr = D.addressFor(code, {
      kind: 'NOI_BO', id: u.user_id, email: u.email || '',
      phone: u.zalo_phone || '', telegram: u.telegram_chat_id || ''
    });

    if (U.isGas()) {
      if (!addr) { ui.toast('Tài khoản của bạn chưa có địa chỉ nhận tin trên kênh này.', 'err'); return; }
      ui.confirm({
        title: 'Gửi tin thử qua ' + D.CHANNELS[code].name + '?',
        text: 'Tin thật sẽ được gửi tới ' + U.mask(addr) + ' qua nhà cung cấp đang cấu hình.',
        ok: 'Gửi thử',
        run: function () {
          LS.api.testChannel(code, addr).then(function (res) {
            return LS.app.refreshServer(res.status === 'DA_GUI'
              ? 'Đã gửi tin thử tới ' + U.mask(addr) + '.'
              : 'Tin thử chưa gửi được: ' + (res.note || res.status));
          }).catch(function (error) { ui.toast(error.message || 'Không gửi được tin thử.', 'err'); });
        }
      });
      return;
    }

    if (!addr) { ui.toast('Tài khoản của bạn chưa có địa chỉ nhận tin trên kênh này.', 'err'); return; }
    if (c.test_mode && c.allowlist.indexOf(addr) === -1) {
      ui.toast('Địa chỉ của bạn chưa có trong danh sách cho phép của kênh.', 'err');
      return;
    }

    st().outbox.unshift({
      outbox_id: U.uid('OUT'), idem_key: U.uid('TEST'), item_id: '', event: 'GUI_THU',
      audience: 'KS', channel: code, recipient_kind: 'NOI_BO', recipient: addr, recipient_name: u.full_name,
      template_code: '', body: 'Tin gửi thử từ màn quản trị LS-Routing.',
      status: 'CHO_GUI', note: '', retry: 0, provider_id: '', created_at: U.now(), sent_at: ''
    });

    logCfg('Kênh gửi tin', 'Gửi thử qua ' + D.CHANNELS[code].name + ' tới ' + U.mask(addr) + '.');
    U.save();
    section = 'outbox';
    LS.app.render();
    ui.toast('Đã xếp tin thử vào hàng đợi.');
  }

  /** Xem trước và kiểm tra biến cấm ngay khi gõ. */
  function hookTemplateLive() {
    var body = document.getElementById('tplBody');
    var chan = document.getElementById('tplChannel');
    if (!body || !chan) return;

    var refresh = function () {
      var tpl = { channel: chan.value, body: body.value };
      var chk = D.checkTemplate(tpl);
      document.getElementById('tplPreview').textContent = D.renderTemplate(body.value, sampleCtx());
      var frame = document.getElementById('tplHtmlPreview'), isMail = chan.value === 'EMAIL';
      if (frame) {
        frame.style.display = isMail ? '' : 'none';
        document.getElementById('tplPreview').style.display = isMail ? 'none' : '';
        if (isMail) {
          var subj = document.getElementById('tplSubject');
          frame.srcdoc = D.emailHtml(D.renderTemplate(subj ? subj.value : '', sampleCtx()), D.renderTemplate(body.value, sampleCtx()), st().settings);
        }
      }
      document.getElementById('tplErrors').innerHTML = tplErrorHtml(chk);
    };

    body.addEventListener('input', refresh);
    chan.addEventListener('change', refresh);
    var subjectInput = document.getElementById('tplSubject');
    if (subjectInput) subjectInput.addEventListener('input', refresh);
    refresh();
  }

  function insertVar(name) {
    var body = document.getElementById('tplBody');
    if (!body) return;
    var s = body.selectionStart, e = body.selectionEnd;
    var token = '{{' + name + '}}';
    body.value = body.value.slice(0, s) + token + body.value.slice(e);
    body.selectionStart = body.selectionEnd = s + token.length;
    body.focus();
    body.dispatchEvent(new Event('input'));
  }

  function saveTemplate(form) {
    var d = new FormData(form);
    var code = form.getAttribute('data-code');
    var tpl = {
      code: code || String(d.get('code')).trim().toUpperCase().replace(/[^A-Z0-9_]/g, '_'),
      name: String(d.get('name')).trim(),
      channel: String(d.get('channel')),
      subject: String(d.get('subject') || '').trim(),
      body: String(d.get('body'))
    };

    var chk = D.checkTemplate(tpl);
    if (!chk.ok) { ui.toast(chk.errors[0], 'err'); return; }

    if (U.isGas()) {
      var existing = code ? U.byId(st().templates, 'code', code) : null;
      var changed = existing && (existing.body !== tpl.body || existing.channel !== tpl.channel);
      LS.api.saveDelivery('template', tpl.code, {
        name: tpl.name, channel: tpl.channel, subject: tpl.subject, body: tpl.body,
        status: existing ? (changed && existing.status === 'DA_DUYET' ? 'CHO_DUYET' : existing.status) : 'CHO_DUYET',
        approved_by: changed ? '' : (existing ? existing.approved_by : ''), approved_at: changed ? '' : (existing ? existing.approved_at : '')
      }).then(function () { ui.closeDialog(); return LS.app.refreshServer('Đã lưu mẫu tin.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể lưu mẫu tin.', 'err'); });
      return;
    }

    if (code) {
      var ex = U.byId(st().templates, 'code', code);
      var changedBody = ex.body !== tpl.body || ex.channel !== tpl.channel;
      ex.name = tpl.name; ex.channel = tpl.channel; ex.subject = tpl.subject; ex.body = tpl.body;
      // Sửa nội dung thì mất hiệu lực duyệt cũ — mẫu phải đi duyệt lại.
      if (changedBody && ex.status === 'DA_DUYET') { ex.status = 'CHO_DUYET'; ex.approved_by = ''; ex.approved_at = ''; }
      commit('Mẫu tin', 'Sửa mẫu ' + ex.code + (changedBody ? ', chuyển về chờ duyệt lại.' : '.'));
    } else {
      if (U.byId(st().templates, 'code', tpl.code)) { ui.toast('Mã mẫu đã tồn tại.', 'err'); return; }
      tpl.status = 'CHO_DUYET';
      tpl.approved_by = ''; tpl.approved_at = '';
      st().templates.push(tpl);
      commit('Mẫu tin', 'Thêm mẫu ' + tpl.code + '.');
    }
  }

  function metrics() {
    var rows = st().notificationMetrics || [];
    var sent = rows.filter(function (m) { return m.status === 'SENT'; }).length;
    var failed = rows.filter(function (m) { return m.status === 'FAILED'; }).length;
    var skipped = rows.filter(function (m) { return m.status === 'KHONG_GUI'; }).length;
    var cost = rows.filter(function (m) { return m.status === 'SENT'; }).reduce(function (n, m) { return n + Number(m.unit_cost || 0); }, 0);
    var groups = {};
    rows.forEach(function (m) {
      var key = (m.month_key || 'Không rõ kỳ') + '|' + (m.channel || '—');
      if (!groups[key]) groups[key] = { month: m.month_key || '—', channel: m.channel || '—', queued: 0, sent: 0, failed: 0, skipped: 0, cost: 0, currency: m.currency || 'VND' };
      var g = groups[key];
      g.queued += 1;
      if (m.status === 'SENT') { g.sent += 1; g.cost += Number(m.unit_cost || 0); }
      if (m.status === 'FAILED') g.failed += 1;
      if (m.status === 'KHONG_GUI') g.skipped += 1;
    });
    var grouped = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) {
      return String(b.month).localeCompare(String(a.month)) || String(a.channel).localeCompare(String(b.channel));
    });
    function money(n, currency) { return Number(n || 0).toLocaleString('vi-VN') + (currency ? ' ' + currency : ''); }
    // Cộng dồn nhiều loại tiền thành một con số là một con số vô nghĩa.
    var currencies = rows.filter(function (m) { return m.status === 'SENT'; })
      .map(function (m) { return m.currency || 'VND'; })
      .filter(function (c, i, all) { return all.indexOf(c) === i; });
    var rate = rows.length ? Math.round(sent * 1000 / rows.length) / 10 : 0;
    return ui.strip([
      ui.metric('Lượt ghi nhận', rows.length),
      ui.metric('Đã gửi', sent, sent ? 'ok' : ''),
      ui.metric('Tỷ lệ thành công', rate + '%', rate < 80 && rows.length ? 'warn' : ''),
      ui.metric('Chi phí', currencies.length === 1 ? money(cost, currencies[0]) : money(cost, '') + ' (nhiều loại tiền)')
    ]) + ui.block({
      title: 'Chi phí và hiệu quả gửi tin', count: grouped.length, icon: 'chart',
      body: ui.table(
        [{ label: 'Kỳ', cls: 'fit' }, { label: 'Kênh', cls: 'fit' }, { label: 'Lượt ghi nhận', cls: 'num' },
          { label: 'Đã gửi', cls: 'num' }, { label: 'Lỗi', cls: 'num' }, { label: 'Không gửi', cls: 'num' }, { label: 'Chi phí', cls: 'num' }],
        grouped.map(function (g) { return { cells: [
          '<span class="tid">' + U.esc(g.month) + '</span>',
          U.esc(D.CHANNELS[g.channel] ? D.CHANNELS[g.channel].name : g.channel),
          '<span class="tid">' + g.queued + '</span>', '<span class="tid">' + g.sent + '</span>',
          '<span class="tid">' + g.failed + '</span>', '<span class="tid">' + g.skipped + '</span>',
          '<span class="tid">' + U.esc(money(g.cost, g.currency)) + '</span>'
        ] }; }),
        { icon: 'chart', title: 'Chưa có dữ liệu gửi', text: 'Số liệu xuất hiện sau khi có tin trong hàng đợi.' }
      )
    });
  }

  function runQueue() {
    if (U.isGas()) {
      LS.api.runOutbox().then(function (result) {
        return LS.app.refreshServer('Đã xử lý ' + result.sent + ' tin; lỗi ' + result.failed + '.');
      }).catch(function (error) { ui.toast(error.message || 'Không thể chạy hàng đợi.', 'err'); });
      return;
    }
    var n = 0;
    st().outbox.forEach(function (o) {
      if (o.status !== 'CHO_GUI') return;
      D.dispatch(o, st());
      n += 1;
    });
    if (!n) { ui.toast('Không có tin nào đang chờ gửi.', 'warn'); return; }
    logCfg('Hàng đợi gửi', 'Chạy hàng đợi, xử lý ' + n + ' tin.');
    U.save();
    LS.app.render();
    ui.toast('Đã xử lý ' + n + ' tin trong hàng đợi.');
  }

  function retry(id) {
    var o = U.byId(st().outbox, 'outbox_id', id);
    var ch = U.byId(st().channels, 'code', o.channel);
    if (o.retry >= ch.max_retry) { ui.toast('Đã vượt số lần gửi lại tối đa của kênh.', 'err'); return; }
    if (U.isGas()) {
      LS.api.changeOutbox(id, 'RETRY').then(function () { return LS.app.refreshServer('Đã đưa tin về hàng chờ gửi.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể gửi lại tin.', 'err'); });
      return;
    }
    o.status = 'CHO_GUI';
    o.note = '';
    U.save();
    LS.app.render();
    ui.toast('Đã đưa tin về hàng chờ gửi.');
  }

  function retryAll() {
    if (U.isGas()) {
      var ids = st().outbox.filter(function (o) {
        var ch = U.byId(st().channels, 'code', o.channel);
        return o.status === 'THAT_BAI' && ch && o.retry < ch.max_retry;
      }).map(function (o) { return o.outbox_id; });
      if (!ids.length) { ui.toast('Không tin nào còn lượt gửi lại.', 'warn'); return; }
      Promise.all(ids.map(function (id) { return LS.api.changeOutbox(id, 'RETRY'); }))
        .then(function () { return LS.app.refreshServer('Đã đưa ' + ids.length + ' tin về hàng chờ.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể gửi lại các tin lỗi.', 'err'); });
      return;
    }
    var n = 0;
    st().outbox.forEach(function (o) {
      if (o.status !== 'THAT_BAI') return;
      var ch = U.byId(st().channels, 'code', o.channel);
      if (o.retry >= ch.max_retry) return;
      o.status = 'CHO_GUI';
      o.note = '';
      n += 1;
    });
    logCfg('Hàng đợi gửi', 'Đưa ' + n + ' tin lỗi về hàng chờ.');
    U.save();
    LS.app.render();
    ui.toast(n ? 'Đã đưa ' + n + ' tin về hàng chờ.' : 'Không tin nào còn lượt gửi lại.', n ? 'ok' : 'warn');
  }

  function saveType(form) {

      name: String(d.get('name')).trim(),

      needs_ks_approval: false,

      checklist: String(d.get('checklist') || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean)
    };

      }).then(function () { ui.closeDialog(); return LS.app.refreshServer('Đã lưu loại việc.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể lưu loại việc.', 'err'); });
      return;
    }

    if (code) {
      var w = U.byId(st().workTypes, 'code', code);

      if (!patch.active && inUse) { ui.toast('Còn ' + inUse + ' việc đang mở dùng loại này.', 'err'); return; }
      Object.keys(patch).forEach(function (k) { w[k] = patch[k]; });
      commit('Loại việc', 'Sửa ' + code + '.');
    } else {
      patch.code = String(d.get('code')).trim().toUpperCase().replace(/[^A-Z0-9_]/g, '_');
      if (U.byId(st().workTypes, 'code', patch.code)) { ui.toast('Mã loại việc đã tồn tại.', 'err'); return; }

  function parseImportMatrix(matrix) {
    var rows = (matrix || []).filter(function (row) {
      return Array.isArray(row) && row.some(function (cell) { return String(cell === undefined || cell === null ? '' : cell).trim() !== ''; });
    });
    if (!rows.length) return [];
    function headerKey(value) {
      return String(value || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    }
    var headers = rows.shift().map(headerKey);
    return rows.map(function (values) {
      var row = {};
      headers.forEach(function (key, index) { if (key) row[key] = String(values[index] === undefined || values[index] === null ? '' : values[index]).trim(); });
      return row;
    });
  }

  function parseImportText(text) {
    var lines = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (x) { return x.trim(); });
    if (!lines.length) return [];
    var delimiter = lines[0].indexOf('\t') !== -1 ? '\t' : (lines[0].indexOf(';') !== -1 ? ';' : ',');
    function cells(line) {
      var out = [], cur = '', quoted = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line.charAt(i);
        if (ch === '"' && line.charAt(i + 1) === '"' && quoted) { cur += '"'; i += 1; continue; }
        if (ch === '"') { quoted = !quoted; continue; }
        if (ch === delimiter && !quoted) { out.push(cur.trim()); cur = ''; } else cur += ch;
      }
      out.push(cur.trim()); return out;
    }
    return parseImportMatrix(lines.map(cells));
  }

  function importUsers(form) {
    var file = form.querySelector('input[type=file]').files[0];
    if (!file) { ui.toast('Chọn file Excel, CSV hoặc TSV trước.', 'err'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var rows;
      function applyRows(parsedRows) {
        rows = parsedRows;
        if (!rows.length) { ui.toast('File không có dòng dữ liệu.', 'err'); return; }
        if (!U.isGas()) {
          rows.forEach(function (r) {
            var code = String(r.login_code || r.ma_can_bo || '').trim();
            if (!code || !r.full_name || !r.unit_id) return;
            var notificationEmail = r.notification_email || r.email || r.email_cong_vu || '';
            var linkedEmail = r.linked_email || r.email_lien_ket || r.google_email || notificationEmail;
            st().users.push({ user_id: r.user_id || U.uid('U'), login_code: code, auth_group: (r.role || 'PHONG_PGD') === 'PHONG_PGD' ? 'EXTERNAL' : 'INTERNAL', full_name: r.full_name, email: notificationEmail, linked_email: linkedEmail, zalo_phone: U.normalizePhone(r.user_phone || r.phone || r.so_dien_thoai || r.zalo_phone || ''), zalo_name: r.zalo_name || '', unit_id: r.unit_id, role: r.role || 'PHONG_PGD', active: r.is_active !== 'false' });
          });
          commit('Người dùng', 'Nhập danh sách cán bộ từ Excel/CSV.'); return;
        }
        LS.api.importUsers(rows).then(function (result) {
          ui.closeDialog(); return LS.app.refreshServer('Đã nhập ' + (result.created + result.updated) + ' cán bộ.');
        }).catch(function (error) { ui.toast(error.message || 'Không thể nhập danh sách cán bộ.', 'err'); });
      }
      if (/\.xlsx?$/i.test(file.name || '')) {
        LS.app.loadXlsx().then(function (X) {
          var book = X.read(reader.result, { type: 'array', cellText: true });
          var sheet = book.Sheets.Users || book.Sheets[book.SheetNames[0]];
          if (!sheet) throw new Error('Excel không có sheet dữ liệu.');
          return parseImportMatrix(X.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '', blankrows: false }));
        }).then(applyRows).catch(function (error) { ui.toast(error.message || 'Không đọc được file Excel.', 'err'); });
        return;
      }
      try { rows = parseImportText(reader.result); } catch (e) { ui.toast('Không đọc được file nhập.', 'err'); return; }
      applyRows(rows);
    };
    if (/\.xlsx?$/i.test(file.name || '')) reader.readAsArrayBuffer(file);
    else reader.readAsText(file, 'UTF-8');
  }

  /** Danh sách tick sản phẩm, gom theo loại việc; mỗi nhóm có ô tick cả nhóm. */
  function ruleProductPicker(selected, allProducts) {
    var groups = [], byGroup = {};
    st().workTypes.filter(function (w) { return w.active; }).forEach(function (w) {
      var g = w.group || w.name;
      if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
      byGroup[g].push(w);
    });
    return '<label class="check"><input type="checkbox" name="all_products" data-rule-scope data-rule-all' + (allProducts ? ' checked' : '') + '>' +
      '<span>Mọi sản phẩm<span class="hint">kể cả sản phẩm thêm sau này; bỏ tick để chọn từng sản phẩm</span></span></label>' +
      '<div class="rule-products' + (allProducts ? ' is-off' : '') + '" id="rule-products">' + groups.map(function (g) {
        var every = byGroup[g].every(function (w) { return selected.indexOf(w.code) !== -1; });
        return '<div class="rule-group" role="group" aria-label="' + U.attr(g) + '"><label class="check rule-group-head"><input type="checkbox" data-rule-scope data-rule-group="' + U.attr(g) + '"' + (every ? ' checked' : '') + '>' +
          '<span><b>' + U.esc(g) + '</b></span></label>' + byGroup[g].map(function (w) {
            return '<label class="check"><input type="checkbox" name="work_type_codes" value="' + U.attr(w.code) + '" data-rule-scope data-rule-item="' + U.attr(g) + '"' +
              (selected.indexOf(w.code) !== -1 ? ' checked' : '') + '><span>' + U.esc(w.name) +
              (D.isPledgeWorkType(w) ? '<span class="hint">cầm cố — mặc định đi theo cán bộ phụ trách phòng</span>' : '') + '</span></label>';

  /** Tick cả nhóm / "Mọi sản phẩm" đổi thì đồng bộ các ô còn lại trong hộp thoại. */
  function syncRuleScope(target) {
    var dlg = document.getElementById('dialog');
    if (!dlg) return;
    var boxes = function (selector) { return Array.prototype.slice.call(dlg.querySelectorAll(selector)); };
    if (target && target.hasAttribute('data-rule-group')) {
      boxes('input[data-rule-item]').forEach(function (b) {
        if (b.getAttribute('data-rule-item') === target.getAttribute('data-rule-group')) b.checked = target.checked;
      });
    }
    boxes('input[data-rule-group]').forEach(function (head) {
      var items = boxes('input[data-rule-item]').filter(function (b) { return b.getAttribute('data-rule-item') === head.getAttribute('data-rule-group'); });
      head.checked = items.length > 0 && items.every(function (b) { return b.checked; });
    });
    var all = dlg.querySelector('[data-rule-all]'), box = dlg.querySelector('#rule-products');
    if (all && box) box.classList.toggle('is-off', all.checked);
  }

  function saveAssignmentRule(form) {
    var d = new FormData(form), id = form.getAttribute('data-id') || U.uid('RULE');
    var unitId = String(d.get('unit_id') || ''), product = String(d.get('product_name') || '').trim(), assignee = String(d.get('assignee_id') || '');
    var staff = U.byId(st().users, 'user_id', assignee);
    if (!staff || staff.role !== 'CAN_BO_LS' || !staff.active) { ui.toast('Chọn cán bộ LS đang hoạt động.', 'err'); return; }
    var allProducts = d.get('all_products') !== null;
    var codes = allProducts ? [] : (d.getAll ? d.getAll('work_type_codes') : []).map(String);
    if (!allProducts && !codes.length) { ui.toast('Tick ít nhất một sản phẩm, hoặc chọn "Mọi sản phẩm".', 'err'); return; }
    // work_type_code giữ lại khi chỉ có một sản phẩm để màn hình mở từ bản cũ vẫn đọc được quy tắc.
    var workType = codes.length === 1 ? codes[0] : '';
    var metadata = { unit_id: unitId, work_type_code: workType, work_type_codes: codes, product_name: product, assignee_id: assignee, priority: Number(d.get('priority') || 1),
      auto_assign: d.get('auto_assign') !== null, priority_processing: d.get('priority_processing') !== null };
    var patch = { catalog_key: 'ASSIGNMENT_RULE', unit_id: unitId, code: workType || 'ALL', label: staff.full_name,
      role_kind: assignee, sort_order: metadata.priority, source_tab: 'Admin', source_row: '', is_active: d.get('active') !== null, metadata_json: JSON.stringify(metadata) };
    if (U.isGas()) {
      LS.api.saveCatalog('catalogOption', id, patch).then(function () { ui.closeDialog(); return LS.app.refreshServer('Đã lưu quy tắc phân công.'); })
        .catch(function (error) { ui.toast(error.message || 'Không thể lưu quy tắc.', 'err'); });
      return;
    }
    var found = U.byId(st().catalogOptions || [], 'option_id', id);
    if (found) { Object.keys(patch).forEach(function (k) { found[k] = k === 'is_active' ? undefined : patch[k]; }); found.active = patch.is_active; found.metadata = metadata; }
    else { patch.option_id = id; patch.active = patch.is_active; patch.metadata = metadata; delete patch.is_active; st().catalogOptions.push(patch); }
    commit('Phân công nhanh', (found ? 'Sửa ' : 'Thêm ') + id + '.');
  }

        .catch(function (error) { ui.toast(error.message || 'Không thể lưu lý do.', 'err'); });
