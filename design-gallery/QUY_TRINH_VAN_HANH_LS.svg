<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680">
  <defs>
    <style>
      .title{font-weight:700;font-size:42px;font-family:Arial,sans-serif;fill:#0f172a}
      .sub{font-weight:400;font-size:20px;font-family:Arial,sans-serif;fill:#64748b}
      .cardTitle{font-weight:700;font-size:27px;font-family:Arial,sans-serif;fill:#172033}
      .cardText{font-weight:400;font-size:19px;font-family:Arial,sans-serif;fill:#526176}
      .num{font-weight:700;font-size:28px;font-family:Arial,sans-serif;fill:#fff}
      .small{font-weight:400;font-size:17px;font-family:Arial,sans-serif;fill:#526176}
      .footer{font-weight:600;font-size:17px;font-family:Arial,sans-serif;fill:#334155}
      .tag{font-weight:700;font-size:14px;font-family:Arial,sans-serif}
      .sla{font-weight:700;font-size:15px;font-family:Arial,sans-serif;fill:#047857}
      .edge{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .branch{stroke:#e11d48;stroke-width:3;fill:none;marker-end:url(#arrowRed)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e11d48"/></marker>
  </defs>
  <rect width="1200" height="1680" fill="#f8fafc"/>
  <text x="600" y="78" text-anchor="middle" class="title">QUY TRÌNH VẬN HÀNH HỒ SƠ LS</text>
  <text x="600" y="114" text-anchor="middle" class="sub">Một luồng chính • SLA tính từ lúc Tiếp nhận hồ sơ • dữ liệu giữ theo kỳ, không xóa</text>
  <rect x="360" y="142" width="480" height="40" rx="20" fill="#e2e8f0"/>
  <text x="600" y="168" text-anchor="middle" class="small">Mỗi khách có thể có nhiều loại việc / WorkItem</text>

  <!-- 1 Phòng/PGD -->
  <g filter="url(#shadow)"><rect x="170" y="225" width="860" height="128" rx="20" fill="#fff" stroke="#bfdbfe" stroke-width="3"/><rect x="170" y="225" width="130" height="128" rx="20" fill="#2563eb"/><text x="235" y="300" text-anchor="middle" class="num">1</text><rect x="326" y="247" width="118" height="28" rx="14" fill="#dbeafe"/><text x="385" y="267" text-anchor="middle" class="tag" fill="#1d4ed8">PHÒNG / PGD</text><text x="326" y="311" class="cardTitle">Tạo và gửi yêu cầu</text><text x="326" y="339" class="cardText">Nhập khách hàng, CIF hoặc “KH mới”, sản phẩm, ngày phát sinh → Chờ phân công.</text></g>
  <path class="edge" d="M600 353 V402"/>

  <!-- 2 Kiểm soát LS: rà soát & phân công -->
  <g filter="url(#shadow)"><rect x="170" y="420" width="860" height="128" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="3"/><rect x="170" y="420" width="130" height="128" rx="20" fill="#7c3aed"/><text x="235" y="495" text-anchor="middle" class="num">2</text><rect x="326" y="442" width="130" height="28" rx="14" fill="#ede9fe"/><text x="391" y="462" text-anchor="middle" class="tag" fill="#6d28d9">KIỂM SOÁT LS</text><text x="326" y="506" class="cardTitle">Rà soát và phân công cán bộ LS</text><text x="326" y="534" class="cardText">Kiểm tra thông tin, chọn người xử lý và hạn xử lý. Chưa tính SLA ở bước này.</text></g>
  <path class="edge" d="M600 548 V580"/>
  <path d="M600 580 L690 630 L600 680 L510 630 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="600" y="624" text-anchor="middle" font-family="Arial" font-weight="700" font-size="21" fill="#92400e">Đủ thông tin?</text>
  <text x="600" y="650" text-anchor="middle" class="small">KS quyết định</text>
  <path class="edge" d="M600 680 V720"/>
  <text x="614" y="708" font-family="Arial" font-weight="700" font-size="15" fill="#475569">ĐỦ → Đã phân công</text>
  <path class="branch" d="M510 630 H110 V282 H164"/>
  <text x="120" y="602" font-family="Arial" font-weight="700" font-size="15" fill="#be123c">THIẾU → trả Phòng/PGD bổ sung</text>

  <!-- 3 Cán bộ LS: tiếp nhận hồ sơ (SLA bắt đầu) -->
  <g filter="url(#shadow)"><rect x="170" y="740" width="860" height="128" rx="20" fill="#fff" stroke="#a7f3d0" stroke-width="3"/><rect x="170" y="740" width="130" height="128" rx="20" fill="#059669"/><text x="235" y="815" text-anchor="middle" class="num">3</text><rect x="326" y="762" width="108" height="28" rx="14" fill="#d1fae5"/><text x="380" y="782" text-anchor="middle" class="tag" fill="#047857">CÁN BỘ LS</text><text x="326" y="826" class="cardTitle">Tiếp nhận hồ sơ — bắt đầu SLA</text><text x="326" y="854" class="cardText">Bấm Tiếp nhận: khởi động SLA và đồng hồ xử lý (trừ nghỉ trưa, ngoài giờ) → Đang thực hiện.</text></g>
  <rect x="858" y="762" width="152" height="28" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="934" y="782" text-anchor="middle" class="sla">SLA START</text>
  <path class="edge" d="M600 868 V917"/>

  <!-- 4 Cán bộ LS: hẹn khách ký -->
  <g filter="url(#shadow)"><rect x="170" y="935" width="860" height="128" rx="20" fill="#fff" stroke="#fed7aa" stroke-width="3"/><rect x="170" y="935" width="130" height="128" rx="20" fill="#d97706"/><text x="235" y="1010" text-anchor="middle" class="num">4</text><rect x="326" y="957" width="108" height="28" rx="14" fill="#ffedd5"/><text x="380" y="977" text-anchor="middle" class="tag" fill="#c2410c">CÁN BỘ LS</text><text x="326" y="1021" class="cardTitle">Hẹn khách ký hồ sơ</text><text x="326" y="1049" class="cardText">Xem trước, xác nhận rồi gửi Email / ZBS / SMS / Telegram theo kênh đã duyệt. Đồng hồ tạm dừng khi chờ ký.</text></g>
  <path class="edge" d="M600 1063 V1112"/>

  <!-- 5 Cán bộ LS: hoàn thành -->
  <g filter="url(#shadow)"><rect x="170" y="1130" width="860" height="128" rx="20" fill="#fff" stroke="#a7f3d0" stroke-width="3"/><rect x="170" y="1130" width="130" height="128" rx="20" fill="#059669"/><text x="235" y="1205" text-anchor="middle" class="num">5</text><rect x="326" y="1152" width="108" height="28" rx="14" fill="#d1fae5"/><text x="380" y="1172" text-anchor="middle" class="tag" fill="#047857">CÁN BỘ LS</text><text x="326" y="1216" class="cardTitle">Hoàn thành hồ sơ</text><text x="326" y="1244" class="cardText">Tích đủ checklist rồi bấm Hoàn thành. Không còn bước “Đã soạn xong” hay trình KS duyệt.</text></g>
  <path class="edge" d="M600 1258 V1307"/>

  <!-- 6 Quản lý / Giám sát: báo cáo -->
  <g filter="url(#shadow)"><rect x="170" y="1325" width="860" height="128" rx="20" fill="#fff" stroke="#99f6e4" stroke-width="3"/><rect x="170" y="1325" width="130" height="128" rx="20" fill="#0f766e"/><text x="235" y="1400" text-anchor="middle" class="num">6</text><rect x="326" y="1347" width="206" height="28" rx="14" fill="#ccfbf1"/><text x="429" y="1367" text-anchor="middle" class="tag" fill="#0f766e">QUẢN LÝ · GIÁM SÁT</text><text x="326" y="1411" class="cardTitle">Báo cáo &amp; Thời gian / SLA</text><text x="326" y="1439" class="cardText">Nhật ký, SLA, báo cáo theo ngày / tuần / tháng / năm hoặc khoảng; dữ liệu giữ theo kỳ.</text></g>

  <rect x="70" y="1500" width="1060" height="96" rx="16" fill="#e2e8f0"/>
  <text x="600" y="1535" text-anchor="middle" class="footer">SLA tính theo giờ làm việc thật, bắt đầu từ lúc Tiếp nhận hồ sơ • đồng hồ dừng khi tạm dừng / chờ ký / đổi người</text>
  <text x="600" y="1567" text-anchor="middle" class="footer">PGD sửa hồ sơ đơn vị mình • KS/LS điều chỉnh loại việc • mọi thay đổi có lý do và lịch sử • việc còn mở sang tháng mới được nhân dòng theo kỳ</text>
</svg>
